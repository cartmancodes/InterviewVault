# Cloudflare Workers Static Assets.
#
# The whole site is prebuilt into site/ by tools/build-site.mjs, so this Worker
# has no script — it just serves the assets. `wrangler deploy` creates the Worker
# on first run, which is why this route needs no pre-created project.
name = "interviewvault"
compatibility_date = "2026-07-01"

[assets]
directory = "./site"

# Serve /answers/bitly/ from /answers/bitly/index.html, and fall back to the
# generated 404 rather than an empty response.
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"

<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc"><title id="title">Why can a Kafka consumer process a record twice?</title><desc id="desc">At-least-once example: commit the next offset only after the effect succeeds.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0E1A2B"/></marker></defs><g font-family="IBM Plex Sans, Arial, sans-serif" fill="#0E1A2B"><rect x="1" y="1" width="958" height="638" rx="16" fill="white" stroke="#0E1A2B" stroke-width="2"/><text x="32" y="43" font-size="25" font-weight="600" text-anchor="start">Why can a Kafka consumer process a record twice?</text><text x="32" y="74" font-size="17" font-weight="400" text-anchor="start">At-least-once example: commit the next offset only after the effect succeeds.</text><g data-step-key="deliver"><rect x="45" y="113" width="245" height="77" rx="10" fill="#EDE8FA" stroke="#0E1A2B" stroke-width="2"/><text x="167.5" y="143" font-size="19" font-weight="600" text-anchor="middle">Kafka partition</text><text x="167.5" y="169" font-size="16" font-weight="400" text-anchor="middle">Record at offset 42</text><path d="M290 150 H390" fill="none" stroke="#0E1A2B" stroke-width="2" marker-end="url(#arrow)"/><text x="307" y="133" font-size="16" font-weight="400" text-anchor="start">1 · fetch</text><rect x="400" y="113" width="245" height="77" rx="10" fill="#FFF6C9" stroke="#0E1A2B" stroke-width="2"/><text x="522.5" y="143" font-size="19" font-weight="600" text-anchor="middle">Consumer</text><text x="522.5" y="169" font-size="16" font-weight="400" text-anchor="middle">Process record 42</text><path d="M645 150 H701" fill="none" stroke="#0E1A2B" stroke-width="2" marker-end="url(#arrow)"/><rect x="715" y="113" width="200" height="77" rx="10" fill="#DDF3EC" stroke="#0E1A2B" stroke-width="2"/><text x="815.0" y="143" font-size="19" font-weight="600" text-anchor="middle">Effect</text><text x="815.0" y="169" font-size="16" font-weight="400" text-anchor="middle">Store HTML</text></g><g data-step-key="commit"><path d="M600 190 V261 H169 V190" fill="none" stroke="#0E1A2B" stroke-width="2" marker-end="url(#arrow)"/><text x="238" y="242" font-size="18" font-weight="600" text-anchor="start">2 · Success: commit next offset = 43</text></g><g data-step-key="crash"><rect x="45" y="307" width="870" height="89" rx="10" fill="#EAF5FD" stroke="#0E1A2B" stroke-width="2"/><text x="67" y="337" font-size="19" font-weight="600" text-anchor="start">Failure window: effect succeeds, consumer crashes before commit.</text><text x="67" y="368" font-size="18" font-weight="400" text-anchor="start">The stored offset is still 42. A replacement consumer starts from 42.</text></g><g data-step-key="replay"><path d="M169 396 V431 H398" fill="none" stroke="#0E1A2B" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="50" y="462" font-size="17" font-weight="400" text-anchor="start">3 · Fetch 42 again</text><rect x="410" y="411" width="285" height="77" rx="10" fill="#FFF6C9" stroke="#0E1A2B" stroke-width="2"/><text x="552.5" y="441" font-size="19" font-weight="600" text-anchor="middle">Reprocess / deduplicate</text><text x="552.5" y="467" font-size="16" font-weight="400" text-anchor="middle">Use a stable event identifier</text></g><g data-step-key="retry"><text x="50" y="527" font-size="19" font-weight="600" text-anchor="start">Replay is not a built-in consumer retry queue.</text><text x="50" y="553" font-size="17" font-weight="400" text-anchor="start">For failed processing, author retry-topic + backoff + DLQ logic explicitly.</text></g><path d="M32 574 H928" stroke="#0E1A2B"/><text x="32" y="605" font-size="15" font-weight="400" text-anchor="start">Violet = log   ·   Yellow = processing   ·   Teal = effect   ·   Dashed = replay after failure</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" role="img" aria-labelledby="ring-title ring-desc"><title id="ring-title">Virtual nodes share a clockwise hash ring</title><desc id="ring-desc">DB1 owns positions 15, 45 and 85. DB2 owns 5, 35 and 65. DB3 owns 25, 55 and 95. A key belongs to the first virtual node clockwise from its hash position.</desc><defs><marker id="ring-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0E1A2B"/></marker></defs><rect x="1" y="1" width="958" height="758" rx="16" fill="white" stroke="#0E1A2B"/><g font-family="Arial, Helvetica, sans-serif" fill="#0E1A2B"><text x="30" y="44" font-size="25" font-weight="bold">Virtual nodes intermix ownership around the ring</text><text x="30" y="77" font-size="17">One physical database owns several positions. Follow the ring clockwise to route a key.</text><circle cx="325" cy="390" r="205" fill="none" stroke="#4F5F79" stroke-width="2"/><path d="M388.35 195.03L408.13 134.17" stroke="#4F5F79" stroke-width="1.5"/><circle cx="388.35" cy="195.03" r="10" fill="#FCE5EA" stroke="#0E1A2B" stroke-width="2"/><rect x="351.13" y="109.17" width="114" height="50" rx="7" fill="#FCE5EA" stroke="#0E1A2B"/><text x="408.13" y="131.17" text-anchor="middle" font-size="16" font-weight="bold">DB2-vn1</text><text x="408.13" y="151.17" text-anchor="middle" font-size="14">position 5</text><path d="M490.85 269.50L542.63 231.89" stroke="#4F5F79" stroke-width="1.5"/><circle cx="490.85" cy="269.50" r="10" fill="#EAF5FD" stroke="#0E1A2B" stroke-width="2"/><rect x="485.63" y="206.89" width="114" height="50" rx="7" fill="#EAF5FD" stroke="#0E1A2B"/><text x="542.63" y="228.89" text-anchor="middle" font-size="16" font-weight="bold">DB1-vn1</text><text x="542.63" y="248.89" text-anchor="middle" font-size="14">position 15</text><path d="M530.00 390.00L594.00 390.00" stroke="#4F5F79" stroke-width="1.5"/><circle cx="530.00" cy="390.00" r="10" fill="#DDF3EC" stroke="#0E1A2B" stroke-width="2"/><rect x="537.00" y="365.00" width="114" height="50" rx="7" fill="#DDF3EC" stroke="#0E1A2B"/><text x="594.00" y="387.00" text-anchor="middle" font-size="16" font-weight="bold">DB3-vn1</text><text x="594.00" y="407.00" text-anchor="middle" font-size="14">position 25</text><path d="M490.85 510.50L542.63 548.11" stroke="#4F5F79" stroke-width="1.5"/><circle cx="490.85" cy="510.50" r="10" fill="#FCE5EA" stroke="#0E1A2B" stroke-width="2"/><rect x="485.63" y="523.11" width="114" height="50" rx="7" fill="#FCE5EA" stroke="#0E1A2B"/><text x="542.63" y="545.11" text-anchor="middle" font-size="16" font-weight="bold">DB2-vn2</text><text x="542.63" y="565.11" text-anchor="middle" font-size="14">position 35</text><path d="M388.35 584.97L408.13 645.83" stroke="#4F5F79" stroke-width="1.5"/><circle cx="388.35" cy="584.97" r="10" fill="#EAF5FD" stroke="#0E1A2B" stroke-width="2"/><rect x="351.13" y="620.83" width="114" height="50" rx="7" fill="#EAF5FD" stroke="#0E1A2B"/><text x="408.13" y="642.83" text-anchor="middle" font-size="16" font-weight="bold">DB1-vn2</text><text x="408.13" y="662.83" text-anchor="middle" font-size="14">position 45</text><path d="M261.65 584.97L241.87 645.83" stroke="#4F5F79" stroke-width="1.5"/><circle cx="261.65" cy="584.97" r="10" fill="#DDF3EC" stroke="#0E1A2B" stroke-width="2"/><rect x="184.87" y="620.83" width="114" height="50" rx="7" fill="#DDF3EC" stroke="#0E1A2B"/><text x="241.87" y="642.83" text-anchor="middle" font-size="16" font-weight="bold">DB3-vn2</text><text x="241.87" y="662.83" text-anchor="middle" font-size="14">position 55</text><path d="M159.15 510.50L107.37 548.11" stroke="#4F5F79" stroke-width="1.5"/><circle cx="159.15" cy="510.50" r="10" fill="#FCE5EA" stroke="#0E1A2B" stroke-width="2"/><rect x="50.37" y="523.11" width="114" height="50" rx="7" fill="#FCE5EA" stroke="#0E1A2B"/><text x="107.37" y="545.11" text-anchor="middle" font-size="16" font-weight="bold">DB2-vn3</text><text x="107.37" y="565.11" text-anchor="middle" font-size="14">position 65</text><path d="M159.15 269.50L107.37 231.89" stroke="#4F5F79" stroke-width="1.5"/><circle cx="159.15" cy="269.50" r="10" fill="#EAF5FD" stroke="#0E1A2B" stroke-width="2"/><rect x="50.37" y="206.89" width="114" height="50" rx="7" fill="#EAF5FD" stroke="#0E1A2B"/><text x="107.37" y="228.89" text-anchor="middle" font-size="16" font-weight="bold">DB1-vn3</text><text x="107.37" y="248.89" text-anchor="middle" font-size="14">position 85</text><path d="M261.65 195.03L241.87 134.17" stroke="#4F5F79" stroke-width="1.5"/><circle cx="261.65" cy="195.03" r="10" fill="#DDF3EC" stroke="#0E1A2B" stroke-width="2"/><rect x="184.87" y="109.17" width="114" height="50" rx="7" fill="#DDF3EC" stroke="#0E1A2B"/><text x="241.87" y="131.17" text-anchor="middle" font-size="16" font-weight="bold">DB3-vn3</text><text x="241.87" y="151.17" text-anchor="middle" font-size="14">position 95</text><path d="M258 296 A115 115 0 0 1 425 334" fill="none" stroke="#0E1A2B" stroke-width="2" marker-end="url(#ring-arrow)"/><text x="325" y="383" text-anchor="middle" font-size="24" font-weight="bold">Hash space</text><text x="325" y="414" text-anchor="middle" font-size="20">0–99</text><text x="325" y="449" text-anchor="middle" font-size="16">Clockwise ownership</text><rect x="657" y="166" width="270" height="438" rx="12" fill="#F6F9FC" stroke="#BAC6D3"/><text x="677" y="201" font-size="19" font-weight="bold">How to read it</text><text x="677" y="237" font-size="16">1. Hash the key.</text><text x="677" y="270" font-size="16">2. Move clockwise to the</text><text x="697" y="294" font-size="16">first virtual node.</text><text x="677" y="327" font-size="16">3. Route to its physical DB.</text><text x="677" y="381" font-size="16" font-weight="bold">Examples</text><text x="677" y="411" font-size="16">Key at 42 → 45 → DB1</text><text x="677" y="440" font-size="16">Key at 98 → 5 → DB2</text><text x="677" y="469" font-size="15">The second route wraps past 99.</text><text x="677" y="523" font-size="16" font-weight="bold">Same DB, same colour</text><text x="677" y="552" font-size="15">Labels also identify the owner.</text><text x="677" y="577" font-size="15">Virtual nodes are not replicas.</text><path d="M30 698H930" stroke="#BAC6D3"/><text x="30" y="731" font-size="15">Blue = DB1 · Pink = DB2 · Teal = DB3. Each position owns the interval immediately before it.</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1050" role="img" aria-labelledby="osi-title osi-desc"><title id="osi-title">Data travels down the sender stack and up the receiver stack</title><desc id="osi-desc">Seven OSI layers add information on the sender side. Signals cross a copper, fiber or wireless medium. The receiver reverses the process.</desc><defs><marker id="osi-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#0E1A2B"/></marker></defs><rect x="1" y="1" width="958" height="1048" rx="16" fill="white" stroke="#0E1A2B"/><g font-family="Arial, Helvetica, sans-serif" fill="#0E1A2B"><text x="32" y="44" font-size="26" font-weight="bold">One message, two directions through the stack</text><text x="32" y="76" font-size="17">Read down the sender, cross the medium, then read up the receiver.</text><text x="45" y="122" font-size="19" font-weight="bold">SENDER · encapsulate ↓</text><text x="515" y="122" font-size="19" font-weight="bold">RECEIVER · decapsulate ↑</text><rect x="40" y="147" width="410" height="82" rx="8" fill="#DDF3EC" stroke="#0E1A2B" stroke-width="1.5"/><text x="56" y="176" font-size="18" font-weight="bold">7. Application</text><text x="56" y="203" font-size="15">User data</text><rect x="510" y="147" width="410" height="82" rx="8" fill="#DDF3EC" stroke="#0E1A2B" stroke-width="1.5"/><text x="526" y="176" font-size="18" font-weight="bold">7. Application</text><text x="526" y="203" font-size="15">Deliver to application</text><path d="M245 229 V254" fill="none" stroke="#0E1A2B" stroke-width="2" marker-end="url(#osi-arrow)"/><path d="M715 259 V234" fill="none" stroke="#0E1A2B" stroke-width="2" marker-end="url(#osi-arrow)"/><rect x="40" y="259" width="410" height="82" rx="8" fill="#FFFFFF" stroke="#0E1A2B" stroke-width="1.5"/><text x="56" y="288" font-size="18" font-weight="bold">6. Presentation</text><text x="56" y="315" font-size="15">Format · compress · encrypt</text><rect x="510" y="259" width="410" height="82" rx="8" fill="#FFFFFF" stroke="#0E1A2B" stroke-width="1.5"/><text x="526" y="288" font-size="18" font-weight="bold">6. Presentation</text><text x="526" y="315" font-size="15">Decrypt · decompress</text><path d="M245 341 V366" fill="none" stroke="#0E1A2B" stroke-width="2" marker-end="url(#osi-arrow)"/><path d="M715 371 V346" fill="none" stroke="#0E1A2B" stroke-width="2" marker-end="url(#osi-arrow)"/><rect x="40" y="371" width="410" height="82" rx="8" fill="#FFFFFF" stroke="#0E1A2B" stroke-width="1.5"/><text x="56" y="400" font-size="18" font-weight="bold">5. Session</text><text x="56" y="427" font-size="15">Add session information</text><rect x="510" y="371" width="410" height="82" rx="8" fill="#FFFFFF" stroke="#0E1A2B" stroke-width="1.5"/><text x="526" y="400" font-size="18" font-weight="bold">5. Session</text><text x="526" y="427" font-size="15">Validate session</text><path d="M245 453 V478" fill="none" stroke="#0E1A2B" stroke-width="2" marker-end="url(#osi-arrow)"/><path d="M715 483 V458" fill="none" stroke="#0E1A2B" stroke-width="2" marker-end="url(#osi-arrow)"/><rect x="40" y="483" width="410" height="82" rx="8" fill="#EAF5FD" stroke="#0E1A2B" stroke-width="1.5"/><text x="56" y="512" font-size="18" font-weight="bold">4. Transport</text><text x="56" y="539" font-size="15">Add segment header</text><rect x="510" y="483" width="410" height="82" rx="8" fill="#EAF5FD" stroke="#0E1A2B" stroke-width="1.5"/><text x="526" y="512" font-size="18" font-weight="bold">4. Transport</text><text x="526" y="539" font-size="15">Remove header · reassemble</text><path d="M245 565 V590" fill="none" stroke="#0E1A2B" stroke-width="2" marker-end="url(#osi-arrow)"/><path d="M715 595 V570" fill="none" stroke="#0E1A2B" stroke-width="2" marker-end="url(#osi-arrow)"/><rect x="40" y="595" width="410" height="82" rx="8" fill="#FFF6C9" stroke="#0E1A2B" stroke-width="1.5"/><text x="56" y="624" font-size="18" font-weight="bold">3. Network</text><text x="56" y="651" font-size="15">Add source and destination IP</text><rect x="510" y="595" width="410" height="82" rx="8" fill="#FFF6C9" stroke="#0E1A2B" stroke-width="1.5"/><text x="526" y="624" font-size="18" font-weight="bold">3. Network</text><text x="526" y="651" font-size="15">Remove IP header · check destination</text><path d="M245 677 V702" fill="none" stroke="#0E1A2B" stroke-width="2" marker-end="url(#osi-arrow)"/><path d="M715 707 V682" fill="none" stroke="#0E1A2B" stroke-width="2" marker-end="url(#osi-arrow)"/><rect x="40" y="707" width="410" height="82" rx="8" fill="#EDE8FA" stroke="#0E1A2B" stroke-width="1.5"/><text x="56" y="736" font-size="18" font-weight="bold">2. Data link</text><text x="56" y="763" font-size="15">Add MAC header and frame trailer</text><rect x="510" y="707" width="410" height="82" rx="8" fill="#EDE8FA" stroke="#0E1A2B" stroke-width="1.5"/><text x="526" y="736" font-size="18" font-weight="bold">2. Data link</text><text x="526" y="763" font-size="15">Remove MAC header · check errors</text><path d="M245 789 V814" fill="none" stroke="#0E1A2B" stroke-width="2" marker-end="url(#osi-arrow)"/><path d="M715 819 V794" fill="none" stroke="#0E1A2B" stroke-width="2" marker-end="url(#osi-arrow)"/><rect x="40" y="819" width="410" height="82" rx="8" fill="#FFFFFF" stroke="#0E1A2B" stroke-width="1.5"/><text x="56" y="848" font-size="18" font-weight="bold">1. Physical</text><text x="56" y="875" font-size="15">Convert bits to signals</text><rect x="510" y="819" width="410" height="82" rx="8" fill="#FFFFFF" stroke="#0E1A2B" stroke-width="1.5"/><text x="526" y="848" font-size="18" font-weight="bold">1. Physical</text><text x="526" y="875" font-size="15">Receive signals · convert to bits</text><path d="M245 901 V951 H715 V906" fill="none" stroke="#0E1A2B" stroke-width="2" marker-end="url(#osi-arrow)"/><rect x="310" y="930" width="340" height="40" rx="6" fill="#FFF6C9" stroke="#0E1A2B"/><text x="480" y="956" text-anchor="middle" font-size="16">Copper / fiber / wireless medium</text><text x="40" y="1013" font-size="16">Matching colours align corresponding layers. Arrows show the direction of processing.</text></g></svg>

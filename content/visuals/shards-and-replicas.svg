<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc"><title id="title">What changes when we shard versus replicate?</title><desc id="desc">Across columns: split the dataset. Down each column: copy the same shard.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0E1A2B"/></marker></defs><g font-family="IBM Plex Sans, Arial, sans-serif" fill="#0E1A2B"><rect x="1" y="1" width="958" height="638" rx="16" fill="white" stroke="#0E1A2B" stroke-width="2"/><text x="32" y="43" font-size="25" font-weight="600" text-anchor="start">What changes when we shard versus replicate?</text><text x="32" y="74" font-size="17" font-weight="400" text-anchor="start">Across columns: split the dataset. Down each column: copy the same shard.</text><g data-step-key="route"><rect x="325" y="100" width="290" height="76" rx="10" fill="#FFF6C9" stroke="#0E1A2B" stroke-width="2"/><text x="470.0" y="130" font-size="19" font-weight="600" text-anchor="middle">Route by order_id</text><text x="470.0" y="156" font-size="16" font-weight="400" text-anchor="middle">Example: order 42 → shard A</text><path d="M470 176 V215 H90 V306 H106" fill="none" stroke="#0E1A2B" stroke-width="2" marker-end="url(#arrow)"/><path d="M490 176 V215 H565 V306 H581" fill="none" stroke="#0E1A2B" stroke-width="2" marker-end="url(#arrow)"/></g><text x="110" y="248" font-size="19" font-weight="600" text-anchor="start">SHARD A · orders 1–100</text><text x="585" y="248" font-size="19" font-weight="600" text-anchor="start">SHARD B · orders 101–200</text><g data-step-key="shards"><path d="M110,280 l22,-18 h250 l-22,18 Z" fill="#EAF5FD" stroke="#0E1A2B" stroke-width="2"/><path d="M360,280 l22,-18 v66 l-22,18 Z" fill="#DDF3EC" stroke="#0E1A2B" stroke-width="2"/><rect x="110" y="280" width="250" height="66" fill="#DDF3EC" stroke="#0E1A2B" stroke-width="2"/><text x="125" y="307" font-size="18" font-weight="600" text-anchor="start">Primary A</text><text x="125" y="331" font-size="15" font-weight="400" text-anchor="start">Different rows from shard B</text><path d="M585,280 l22,-18 h250 l-22,18 Z" fill="#EAF5FD" stroke="#0E1A2B" stroke-width="2"/><path d="M835,280 l22,-18 v66 l-22,18 Z" fill="#DDF3EC" stroke="#0E1A2B" stroke-width="2"/><rect x="585" y="280" width="250" height="66" fill="#DDF3EC" stroke="#0E1A2B" stroke-width="2"/><text x="600" y="307" font-size="18" font-weight="600" text-anchor="start">Primary B</text><text x="600" y="331" font-size="15" font-weight="400" text-anchor="start">Different rows from shard A</text></g><g data-step-key="replicas"><path d="M235 346 V399" fill="none" stroke="#0E1A2B" stroke-width="2" marker-end="url(#arrow)"/><path d="M710 346 V399" fill="none" stroke="#0E1A2B" stroke-width="2" marker-end="url(#arrow)"/><text x="250" y="378" font-size="16" font-weight="400" text-anchor="start">copy A</text><text x="725" y="378" font-size="16" font-weight="400" text-anchor="start">copy B</text><path d="M110,418 l22,-18 h250 l-22,18 Z" fill="#EAF5FD" stroke="#0E1A2B" stroke-width="2"/><path d="M360,418 l22,-18 v66 l-22,18 Z" fill="#DDF3EC" stroke="#0E1A2B" stroke-width="2"/><rect x="110" y="418" width="250" height="66" fill="#DDF3EC" stroke="#0E1A2B" stroke-width="2"/><text x="125" y="445" font-size="18" font-weight="600" text-anchor="start">Replica A</text><text x="125" y="469" font-size="15" font-weight="400" text-anchor="start">Same rows as primary A</text><path d="M585,418 l22,-18 h250 l-22,18 Z" fill="#EAF5FD" stroke="#0E1A2B" stroke-width="2"/><path d="M835,418 l22,-18 v66 l-22,18 Z" fill="#DDF3EC" stroke="#0E1A2B" stroke-width="2"/><rect x="585" y="418" width="250" height="66" fill="#DDF3EC" stroke="#0E1A2B" stroke-width="2"/><text x="600" y="445" font-size="18" font-weight="600" text-anchor="start">Replica B</text><text x="600" y="469" font-size="15" font-weight="400" text-anchor="start">Same rows as primary B</text></g><g data-step-key="placement"><text x="110" y="530" font-size="17" font-weight="400" text-anchor="start">Separate machine / failure domain</text><text x="585" y="530" font-size="17" font-weight="400" text-anchor="start">Separate machine / failure domain</text></g><path d="M32 574 H928" stroke="#0E1A2B"/><text x="32" y="605" font-size="15" font-weight="400" text-anchor="start">Teal = stored rows   ·   Yellow = routing   ·   Depth = separate storage instances</text></g></svg>
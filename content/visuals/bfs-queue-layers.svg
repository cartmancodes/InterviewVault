<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc"><title id="title">Why does BFS mark a vertex when it enters the queue?</title><desc id="desc">One source, unit-cost edges, neighbors visited B before C. D has two possible parents.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0E1A2B"/></marker></defs><g font-family="IBM Plex Sans, Arial, sans-serif" fill="#0E1A2B"><rect x="1" y="1" width="958" height="638" rx="16" fill="white" stroke="#0E1A2B" stroke-width="2"/><text x="32" y="43" font-size="25" font-weight="600" text-anchor="start">Why does BFS mark a vertex when it enters the queue?</text><text x="32" y="74" font-size="17" font-weight="400" text-anchor="start">One source, unit-cost edges, neighbors visited B before C. D has two possible parents.</text><text x="48" y="118" font-size="17" font-weight="600" text-anchor="start">UNWEIGHTED GRAPH</text><path d="M110 255 L265 185" stroke="#0E1A2B" stroke-width="2"/><path d="M110 255 L265 325" stroke="#0E1A2B" stroke-width="2"/><path d="M265 185 L420 255" stroke="#0E1A2B" stroke-width="2"/><path d="M265 325 L420 255" stroke="#0E1A2B" stroke-width="2"/><g data-step-key="source"><circle cx="110" cy="255" r="29" fill="#EAF5FD" stroke="#0E1A2B" stroke-width="2"/><text x="110" y="262" font-size="23" font-weight="600" text-anchor="middle">A</text><text x="110" y="310" font-size="17" font-weight="400" text-anchor="middle">d = 0</text></g><g data-step-key="layer-one"><circle cx="265" cy="185" r="29" fill="#FFF6C9" stroke="#0E1A2B" stroke-width="2"/><text x="265" y="192" font-size="23" font-weight="600" text-anchor="middle">B</text><text x="265" y="240" font-size="17" font-weight="400" text-anchor="middle">d = 1</text></g><g data-step-key="layer-one"><circle cx="265" cy="325" r="29" fill="#FFF6C9" stroke="#0E1A2B" stroke-width="2"/><text x="265" y="332" font-size="23" font-weight="600" text-anchor="middle">C</text><text x="265" y="380" font-size="17" font-weight="400" text-anchor="middle">d = 1</text></g><g data-step-key="layer-two"><circle cx="420" cy="255" r="29" fill="#FFF6C9" stroke="#0E1A2B" stroke-width="2"/><text x="420" y="262" font-size="23" font-weight="600" text-anchor="middle">D</text><text x="420" y="310" font-size="17" font-weight="400" text-anchor="middle">d = 2</text></g><text x="520" y="118" font-size="17" font-weight="600" text-anchor="start">FIFO QUEUE · FRONT AT LEFT</text><g data-step-key="seed"><rect x="510" y="152" width="402" height="84" rx="10" fill="#EDE8FA" stroke="#0E1A2B" stroke-width="2"/><text x="528" y="179" font-size="18" font-weight="600" text-anchor="start">0 · Enqueue A</text><text x="888" y="179" font-size="20" font-weight="600" text-anchor="end">[ A ]</text><text x="528" y="210" font-size="16" font-weight="400" text-anchor="start">Mark A immediately.</text></g><g data-step-key="expand-a"><rect x="510" y="249" width="402" height="84" rx="10" fill="#EDE8FA" stroke="#0E1A2B" stroke-width="2"/><text x="528" y="276" font-size="18" font-weight="600" text-anchor="start">1 · Pop A</text><text x="888" y="276" font-size="20" font-weight="600" text-anchor="end">[ B, C ]</text><text x="528" y="307" font-size="16" font-weight="400" text-anchor="start">Discover B before C; mark both.</text></g><g data-step-key="expand-b"><rect x="510" y="346" width="402" height="84" rx="10" fill="#EDE8FA" stroke="#0E1A2B" stroke-width="2"/><text x="528" y="373" font-size="18" font-weight="600" text-anchor="start">2 · Pop B</text><text x="888" y="373" font-size="20" font-weight="600" text-anchor="end">[ C, D ]</text><text x="528" y="404" font-size="16" font-weight="400" text-anchor="start">Discover D and mark it.</text></g><g data-step-key="expand-c"><rect x="510" y="443" width="402" height="84" rx="10" fill="#EDE8FA" stroke="#0E1A2B" stroke-width="2"/><text x="528" y="470" font-size="18" font-weight="600" text-anchor="start">3 · Pop C</text><text x="888" y="470" font-size="20" font-weight="600" text-anchor="end">[ D ]</text><text x="528" y="501" font-size="16" font-weight="400" text-anchor="start">D is visited: do not enqueue again.</text></g><g data-step-key="done"><text x="48" y="438" font-size="18" font-weight="600" text-anchor="start">Discovery order: A → B → C → D</text><text x="48" y="470" font-size="17" font-weight="400" text-anchor="start">Queue order preserves distance layers.</text><text x="48" y="500" font-size="17" font-weight="400" text-anchor="start">4 · Pop D → queue empty; done.</text></g><path d="M32 574 H928" stroke="#0E1A2B"/><text x="32" y="605" font-size="15" font-weight="400" text-anchor="start">Sky = source   ·   Yellow = discovered vertices   ·   Violet = queue snapshots</text></g></svg>
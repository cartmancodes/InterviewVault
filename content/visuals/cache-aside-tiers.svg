<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc"><title id="title">How does cache-aside avoid a database read?</title><desc id="desc">Follow the hit branch or the miss branch; they are alternatives for one request.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0E1A2B"/></marker></defs><g font-family="IBM Plex Sans, Arial, sans-serif" fill="#0E1A2B"><rect x="1" y="1" width="958" height="638" rx="16" fill="white" stroke="#0E1A2B" stroke-width="2"/><text x="32" y="43" font-size="25" font-weight="600" text-anchor="start">How does cache-aside avoid a database read?</text><text x="32" y="74" font-size="17" font-weight="400" text-anchor="start">Follow the hit branch or the miss branch; they are alternatives for one request.</text><g data-step-key="lookup"><rect x="50" y="120" width="240" height="76" rx="10" fill="#FFF6C9" stroke="#0E1A2B" stroke-width="2"/><text x="170.0" y="150" font-size="19" font-weight="600" text-anchor="middle">Application</text><text x="170.0" y="176" font-size="16" font-weight="400" text-anchor="middle">1 · Read profile key</text><path d="M290 155 H385" fill="none" stroke="#0E1A2B" stroke-width="2" marker-end="url(#arrow)"/><text x="314" y="138" font-size="16" font-weight="400" text-anchor="start">GET</text><path d="M400,120 l22,-18 h400 l-22,18 Z" fill="#EAF5FD" stroke="#0E1A2B" stroke-width="2"/><path d="M800,120 l22,-18 v66 l-22,18 Z" fill="#DDF3EC" stroke="#0E1A2B" stroke-width="2"/><rect x="400" y="120" width="400" height="66" fill="#DDF3EC" stroke="#0E1A2B" stroke-width="2"/><text x="415" y="147" font-size="18" font-weight="600" text-anchor="start">Redis · memory tier</text><text x="415" y="171" font-size="15" font-weight="400" text-anchor="start">2 · Check for a reusable cached value</text></g><g data-step-key="hit"><path d="M400 186 H335 V239 H170 V196" fill="none" stroke="#0E1A2B" stroke-width="2" marker-end="url(#arrow)"/><text x="53" y="268" font-size="18" font-weight="600" text-anchor="start">HIT → return cached value</text></g><g data-step-key="miss"><path d="M170 286 V362 H385" fill="none" stroke="#0E1A2B" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="190" y="338" font-size="17" font-weight="400" text-anchor="start">MISS → read DB</text><path d="M400,336 l22,-18 h400 l-22,18 Z" fill="#EAF5FD" stroke="#0E1A2B" stroke-width="2"/><path d="M800,336 l22,-18 v66 l-22,18 Z" fill="#DDF3EC" stroke="#0E1A2B" stroke-width="2"/><rect x="400" y="336" width="400" height="66" fill="#DDF3EC" stroke="#0E1A2B" stroke-width="2"/><text x="415" y="363" font-size="18" font-weight="600" text-anchor="start">Database · durable tier</text><text x="415" y="387" font-size="15" font-weight="400" text-anchor="start">3 · Read the authoritative profile</text></g><g data-step-key="fill"><path d="M822 370 H894 V153 H826" fill="none" stroke="#0E1A2B" stroke-width="2" marker-end="url(#arrow)"/><text x="490" y="265" font-size="18" font-weight="600" text-anchor="start">4 · Application fills cache + TTL</text><text x="490" y="291" font-size="17" font-weight="400" text-anchor="start">Then returns the fetched value.</text></g><g data-step-key="tiers"><rect x="48" y="445" width="850" height="101" rx="10" fill="#EAF5FD" stroke="#0E1A2B" stroke-width="2"/><text x="70" y="476" font-size="19" font-weight="600" text-anchor="start">Cache-aside: the application coordinates both stores.</text><text x="70" y="505" font-size="17" font-weight="400" text-anchor="start">A hit skips the database. A miss pays for the database read and cache fill.</text><text x="70" y="530" font-size="17" font-weight="400" text-anchor="start">Depth distinguishes storage tiers; the cache is a disposable copy.</text></g><path d="M32 574 H928" stroke="#0E1A2B"/><text x="32" y="605" font-size="15" font-weight="400" text-anchor="start">Teal = storage   ·   Yellow = application   ·   Dashed arrow = cache-miss branch</text></g></svg>
  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

on { background:rgba(37,99,235,.16); }\n  @keyframes fadeIn { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:none; } }\n  @keyframes blink { 0%,100% { opacity:1; } 50% { opacity:.25; } }\n  @keyframes dot { 0%,80%,100% { transform:translateY(0); opacity:.4; } 40% { transform:translateY(-3px); opacity:1; } }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"display:flex;min-height:100vh;align-items:stretch\">\n\n  <!-- ============ LEFT RAIL ============ -->\n  <aside style=\"width:232px;flex:0 0 232px;background:#fff;border-right:1px solid hsl(220 15% 88%);display:flex;flex-direction:column;position:sticky;top:0;height:100vh\">\n    <div style=\"padding:16px 16px 12px;display:flex;align-items:center;gap:9px\">\n      <div style=\"width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg, hsl(220 70% 50%) 0%, hsl(220 70% 35%) 100%);display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:700;letter-spacing:-.02em\">IV<\u002Fdiv>\n      <div style=\"font-size:15px;font-weight:700;color:#002244;letter-spacing:-.01em\">InterviewVault<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"padding:0 12px 12px;display:flex;gap:4px\">\n      <sc-for list=\"{{ tracks }}\" as=\"t\" hint-placeholder-count=\"2\">\n        <button sc-camel-on-click=\"{{ t.onSelect }}\" style=\"flex:1;padding:6px 0;border-radius:9999px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid {{ t.bc }};background:{{ t.bg }};color:{{ t.fg }}\">{{ t.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <nav style=\"padding:0 8px;display:flex;flex-direction:column;gap:2px\">\n      <sc-for list=\"{{ nav }}\" as=\"n\" hint-placeholder-count=\"7\">\n        <button sc-camel-on-click=\"{{ n.onSelect }}\" style=\"display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 10px;border:0;border-radius:8px;cursor:pointer;font-size:13.5px;font-weight:{{ n.fw }};background:{{ n.bg }};color:{{ n.fg }}\">\n          <i data-lucide=\"{{ n.icon }}\" style=\"flex:0 0 16px\"><\u002Fi>\n          <span style=\"flex:1\">{{ n.label }}<\u002Fspan>\n          <span style=\"font-size:11px;font-weight:600;color:{{ n.badgeFg }}\">{{ n.badge }}<\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fnav>\n\n    <div style=\"margin-top:auto;padding:12px\">\n      <div style=\"border:1px solid hsl(220 15% 88%);border-radius:12px;padding:10px 12px\">\n        <div style=\"font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:hsl(220 10% 50%);margin-bottom:8px\">Streak<\u002Fdiv>\n        <div style=\"display:flex;gap:4px;align-items:flex-end;margin-bottom:8px\">\n          <sc-for list=\"{{ streak }}\" as=\"d\" hint-placeholder-count=\"7\">\n            <div style=\"flex:1;display:flex;flex-direction:column;align-items:center;gap:4px\">\n              <div style=\"width:100%;border-radius:3px;background:{{ d.bg }};height:{{ d.h }}\"><\u002Fdiv>\n              <div style=\"font-size:9px;color:hsl(220 10% 50%)\">{{ d.label }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"font-size:13px;font-weight:700;color:hsl(220 15% 20%)\">12 days<\u002Fdiv>\n        <div style=\"font-size:12px;color:hsl(220 10% 50%);line-height:1.4\">Best run yet. 41 min avg.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Faside>\n\n  <!-- ============ MAIN ============ -->\n  <main style=\"flex:1;min-width:0;display:flex;flex-direction:column\">\n\n    <header style=\"position:sticky;top:0;z-index:20;background:hsl(220 100% 97% / .92);backdrop-filter:blur(8px);border-bottom:1px solid hsl(220 15% 88%);padding:10px 24px;display:flex;align-items:center;gap:14px\">\n      <div style=\"flex:1;min-width:0\">\n        <div style=\"font-size:12px;color:hsl(220 10% 50%)\">{{ crumb }}<\u002Fdiv>\n        <div style=\"font-size:17px;font-weight:700;letter-spacing:-.01em\">{{ screenTitle }}<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:6px;background:#fff;border:1px solid hsl(220 15% 88%);border-radius:9999px;padding:6px 12px;width:260px\">\n        <i data-lucide=\"search\" style=\"color:hsl(220 10% 50%)\"><\u002Fi>\n        <span style=\"font-size:13px;color:hsl(220 10% 50%)\">Search 30 problems, 29 concepts<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;background:hsl(220 15% 96%);border-radius:9999px;padding:3px\">\n        <sc-for list=\"{{ levels }}\" as=\"l\" hint-placeholder-count=\"3\">\n          <button sc-camel-on-click=\"{{ l.onSelect }}\" style=\"border:0;cursor:pointer;padding:5px 12px;border-radius:9999px;font-size:12px;font-weight:600;background:{{ l.bg }};color:{{ l.fg }};box-shadow:{{ l.sh }}\">{{ l.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <button style=\"border:0;cursor:pointer;background:#2563EB;color:#fff;border-radius:12px;padding:9px 14px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px\" sc-camel-on-click=\"{{ goPractice }}\">\n        <i data-lucide=\"play\"><\u002Fi> Start session\n      <\u002Fbutton>\n    <\u002Fheader>\n\n    <div style=\"padding:22px 24px 56px;max-width:1240px;width:100%\">\n\n      <!-- ================= TODAY ================= -->\n      <sc-if value=\"{{ isToday }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"display:flex;flex-direction:column;gap:16px\">\n\n        <div style=\"border-radius:12px;padding:18px 20px;background:linear-gradient(135deg, hsl(220 70% 50%) 0%, hsl(220 70% 35%) 100%);color:#fff;display:flex;align-items:center;gap:24px\">\n          <div style=\"flex:1\">\n            <div style=\"font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;opacity:.72;margin-bottom:6px\">Pick up where you left off<\u002Fdiv>\n            <div style=\"font-size:26px;font-weight:700;letter-spacing:-.01em;margin-bottom:4px\">Design Bitly — Deep Dives<\u002Fdiv>\n            <div style=\"font-size:14px;opacity:.85;line-height:1.5;max-width:640px;text-wrap:pretty\">{{ coachLine }}<\u002Fdiv>\n            <div style=\"display:flex;gap:8px;margin-top:14px\">\n              <button sc-camel-on-click=\"{{ goRead }}\" style=\"border:0;cursor:pointer;background:#fff;color:#1D4ED8;border-radius:12px;padding:9px 15px;font-size:13px;font-weight:600\">Resume reading<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ goPractice }}\" style=\"cursor:pointer;background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:12px;padding:9px 15px;font-size:13px;font-weight:600\">Skip to mock<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"flex:0 0 132px;text-align:center\">\n            <div style=\"font-size:44px;font-weight:700;line-height:1\">62<span style=\"font-size:18px;opacity:.6\">/100<\u002Fspan><\u002Fdiv>\n            <div style=\"font-size:12px;opacity:.75;margin-top:2px\">Mastery · manageable<\u002Fdiv>\n            <div style=\"height:6px;border-radius:9999px;background:rgba(255,255,255,.25);margin-top:10px;overflow:hidden\">\n              <div style=\"height:100%;border-radius:9999px;background:hsl(38 90% 62%);width:62%\"><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:1.55fr 1fr;gap:16px;align-items:start\">\n\n          <div style=\"background:#fff;border:1px solid hsl(220 15% 88%);border-radius:12px;box-shadow:0 1px 2px 0 rgb(0 0 0/.05);padding:16px 18px\">\n            <div style=\"display:flex;align-items:baseline;justify-content:space-between;margin-bottom:4px\">\n              <div style=\"font-size:18px;font-weight:700\">Today's plan<\u002Fdiv>\n              <div style=\"font-size:13px;color:hsl(220 10% 50%)\">71 min · 4 blocks<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-size:13px;color:hsl(220 10% 50%);line-height:1.5;margin-bottom:14px;text-wrap:pretty\">Warm-up first so recall is cheap, then read, then the mock while you're sharp. Review last — it's the block people skip and the one that moves the score.<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:0\">\n              <sc-for list=\"{{ plan }}\" as=\"p\" hint-placeholder-count=\"4\">\n                <div style=\"display:flex;gap:12px;align-items:stretch\">\n                  <div style=\"flex:0 0 20px;display:flex;flex-direction:column;align-items:center\">\n                    <div style=\"width:11px;height:11px;border-radius:9999px;margin-top:5px;border:2px solid {{ p.dot }};background:{{ p.dotFill }}\"><\u002Fdiv>\n                    <div style=\"flex:1;width:2px;background:hsl(220 15% 88%)\"><\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"flex:1;padding-bottom:14px\">\n                    <div style=\"display:flex;align-items:center;gap:8px\">\n                      <div style=\"font-size:14px;font-weight:600;color:{{ p.fg }}\">{{ p.title }}<\u002Fdiv>\n                      <div style=\"border-radius:9999px;padding:1px 8px;font-size:11px;font-weight:600;background:{{ p.tagBg }};color:{{ p.tagFg }}\">{{ p.kind }}<\u002Fdiv>\n                      <div style=\"font-size:12px;color:hsl(220 10% 50%);margin-left:auto\">{{ p.mins }}<\u002Fdiv>\n                    <\u002Fdiv>\n                    <div style=\"font-size:13px;color:hsl(220 10% 50%);line-height:1.45;margin-top:2px\">{{ p.why }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display:flex;flex-direction:column;gap:16px\">\n            <div style=\"background:#fff;border:1px solid hsl(220 15% 88%);border-radius:12px;box-shadow:0 1px 2px 0 rgb(0 0 0/.05);padding:16px 18px\">\n              <div style=\"font-size:15px;font-weight:700;margin-bottom:2px\">Where you actually stand<\u002Fdiv>\n              <div style=\"font-size:12.5px;color:hsl(220 10% 50%);line-height:1.45;margin-bottom:14px\">Scored per phase of the interview, not per problem. Deep dives and numbers are what separate Senior from Staff.<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:10px\">\n                <sc-for list=\"{{ mastery }}\" as=\"m\" hint-placeholder-count=\"6\">\n                  <div>\n                    <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px\">\n                      <span style=\"font-size:13px;font-weight:500\">{{ m.label }}<\u002Fspan>\n                      <span style=\"font-size:13px;font-weight:700;color:{{ m.color }}\">{{ m.score }}<\u002Fspan>\n                    <\u002Fdiv>\n                    <div style=\"height:6px;border-radius:9999px;background:hsl(220 15% 96%);overflow:hidden\">\n                      <div style=\"height:100%;border-radius:9999px;background:{{ m.color }};width:{{ m.w }}\"><\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"background:#fff;border:1px solid hsl(220 15% 88%);border-radius:12px;box-shadow:0 1px 2px 0 rgb(0 0 0/.05);padding:16px 18px\">\n              <div style=\"display:grid;grid-template-columns:1fr;gap:14px\">\n                <div>\n                  <div style=\"font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:hsl(158 64% 42%);margin-bottom:7px\">Good signals<\u002Fdiv>\n                  <div style=\"display:flex;flex-direction:column;gap:6px\">\n                    <sc-for list=\"{{ goodSignals }}\" as=\"s\" hint-placeholder-count=\"3\">\n                      <div style=\"font-size:13px;line-height:1.45;padding-left:12px;border-left:2px solid hsl(158 64% 52%)\">{{ s }}<\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div>\n                  <div style=\"font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:hsl(0 70% 45%);margin-bottom:7px\">Poor signals<\u002Fdiv>\n                  <div style=\"display:flex;flex-direction:column;gap:6px\">\n                    <sc-for list=\"{{ poorSignals }}\" as=\"s\" hint-placeholder-count=\"3\">\n                      <div style=\"font-size:13px;line-height:1.45;padding-left:12px;border-left:2px solid hsl(0 70% 50%)\">{{ s }}<\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ================= LIBRARY ================= -->\n      <sc-if value=\"{{ isLibrary }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"display:flex;flex-direction:column;gap:14px\">\n\n        <sc-if value=\"{{ trackIsLLD }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"background:#fff;border:1px solid hsl(220 15% 88%);border-radius:12px;box-shadow:0 1px 2px 0 rgb(0 0 0/.05);padding:34px 28px;text-align:center\">\n            <div style=\"width:40px;height:40px;border-radius:12px;background:hsl(220 100% 97%);display:inline-flex;align-items:center;justify-content:center;color:#2563EB;margin-bottom:12px\"><i data-lucide-lg=\"boxes\"><\u002Fi><\u002Fdiv>\n            <div style=\"font-size:19px;font-weight:700;margin-bottom:6px\">The LLD track is empty — on purpose<\u002Fdiv>\n            <div style=\"font-size:14px;color:hsl(220 10% 50%);line-height:1.55;max-width:560px;margin:0 auto 16px;text-wrap:pretty\">Your vault currently files system design under <code style=\"font-family:ui-monospace,Menlo,monospace;font-size:13px;background:hsl(220 15% 96%);padding:1px 5px;border-radius:4px\">LLD/<\u002Fcode>, but every file in it is high-level design. True LLD — class diagrams, SOLID, design patterns, parking lot / elevator / rate-limiter-in-code — needs its own drill types: UML canvas, method-signature recall, and a code editor instead of a whiteboard.<\u002Fdiv>\n            <div style=\"display:flex;gap:16px;justify-content:center;flex-wrap:wrap;max-width:660px;margin:0 auto\">\n              <sc-for list=\"{{ lldPlan }}\" as=\"l\" hint-placeholder-count=\"3\">\n                <div style=\"flex:1 1 190px;text-align:left;border:1px solid hsl(220 15% 88%);border-radius:12px;padding:12px 14px\">\n                  <div style=\"font-size:13.5px;font-weight:600;margin-bottom:3px\">{{ l.title }}<\u002Fdiv>\n                  <div style=\"font-size:12.5px;color:hsl(220 10% 50%);line-height:1.45\">{{ l.body }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ trackIsHLD }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display:flex;flex-direction:column;gap:14px\">\n          <div style=\"display:flex;gap:6px;flex-wrap:wrap;align-items:center\">\n            <sc-for list=\"{{ filters }}\" as=\"f\" hint-placeholder-count=\"6\">\n              <button sc-camel-on-click=\"{{ f.onSelect }}\" style=\"cursor:pointer;border-radius:9999px;padding:5px 12px;font-size:12.5px;font-weight:600;border:1px solid {{ f.bc }};background:{{ f.bg }};color:{{ f.fg }}\">{{ f.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n            <div style=\"margin-left:auto;font-size:13px;color:hsl(220 10% 50%)\">{{ libCount }}<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"background:#fff;border:1px solid hsl(220 15% 88%);border-radius:12px;box-shadow:0 1px 2px 0 rgb(0 0 0/.05);overflow:hidden\">\n            <div style=\"display:grid;grid-template-columns:2.1fr 1.7fr .8fr 1.6fr 1fr 88px;gap:12px;padding:10px 16px;border-bottom:1px solid hsl(220 15% 88%);background:hsl(220 15% 96% / .6)\">\n              <div style=\"font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:hsl(220 10% 50%)\">Problem<\u002Fdiv>\n              <div style=\"font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:hsl(220 10% 50%)\">Pattern<\u002Fdiv>\n              <div style=\"font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:hsl(220 10% 50%)\">Level<\u002Fdiv>\n              <div style=\"font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:hsl(220 10% 50%)\">Phase coverage<\u002Fdiv>\n              <div style=\"font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:hsl(220 10% 50%)\">Mastery<\u002Fdiv>\n              <div><\u002Fdiv>\n            <\u002Fdiv>\n            <sc-for list=\"{{ problems }}\" as=\"p\" hint-placeholder-count=\"10\">\n              <div style=\"display:grid;grid-template-columns:2.1fr 1.7fr .8fr 1.6fr 1fr 88px;gap:12px;padding:11px 16px;border-bottom:1px solid hsl(220 15% 94%);align-items:center\">\n                <div>\n                  <div style=\"font-size:14px;font-weight:600\">{{ p.name }}<\u002Fdiv>\n                  <div style=\"font-size:12px;color:hsl(220 10% 50%)\">{{ p.meta }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"font-size:13px;color:hsl(220 15% 20%)\">{{ p.pattern }}<\u002Fdiv>\n                <div><span style=\"border-radius:9999px;padding:2px 9px;font-size:11.5px;font-weight:600;background:{{ p.diffBg }};color:{{ p.diffFg }}\">{{ p.difficulty }}<\u002Fspan><\u002Fdiv>\n                <div style=\"display:flex;gap:3px;align-items:flex-end;height:22px\">\n                  <sc-for list=\"{{ p.bars }}\" as=\"b\" hint-placeholder-count=\"6\">\n                    <div title=\"{{ b.label }}\" style=\"width:9px;border-radius:2px;background:{{ b.color }};height:{{ b.h }}\"><\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"display:flex;align-items:center;gap:8px\">\n                  <span style=\"border-radius:9999px;padding:2px 9px;font-size:12px;font-weight:700;background:{{ p.scoreBg }};color:{{ p.scoreFg }}\">{{ p.scoreLabel }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"text-align:right\">\n                  <button sc-camel-on-click=\"{{ p.onOpen }}\" style=\"cursor:pointer;border:1px solid hsl(220 15% 88%);background:#fff;border-radius:9999px;padding:5px 12px;font-size:12px;font-weight:600;color:hsl(220 15% 20%)\">{{ p.cta }}<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ================= READ ================= -->\n      <sc-if value=\"{{ isRead }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:grid;grid-template-columns:minmax(0,1fr) 232px;gap:22px;align-items:start\">\n\n        <div style=\"display:flex;flex-direction:column;gap:16px;min-width:0\">\n\n          <div style=\"background:#fff;border:1px solid hsl(220 15% 88%);border-radius:12px;box-shadow:0 1px 2px 0 rgb(0 0 0/.05);padding:18px 20px\">\n            <div style=\"display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px\">\n              <span style=\"border-radius:9999px;padding:2px 9px;font-size:11.5px;font-weight:600;background:hsl(220 100% 97%);color:#1D4ED8\">Read-Heavy / Hash-based Lookup<\u002Fspan>\n              <span style=\"border-radius:9999px;padding:2px 9px;font-size:11.5px;font-weight:600;background:hsl(158 64% 52% / .15);color:hsl(158 64% 32%)\">Easy<\u002Fspan>\n              <span style=\"border-radius:9999px;padding:2px 9px;font-size:11.5px;font-weight:600;background:hsl(220 15% 96%);color:hsl(220 10% 40%)\">8 diagrams<\u002Fspan>\n              <span style=\"border-radius:9999px;padding:2px 9px;font-size:11.5px;font-weight:600;background:hsl(220 15% 96%);color:hsl(220 10% 40%)\">497 lines<\u002Fspan>\n            <\u002Fdiv>\n            <h1 style=\"margin:0 0 8px;font-size:32px;font-weight:700;letter-spacing:-.015em\">Design Bitly<\u002Fh1>\n            <p style=\"margin:0;font-size:15px;line-height:1.6;color:hsl(220 15% 30%);max-width:74ch;text-wrap:pretty\">Bitly turns long URLs into compact short codes and redirects visitors back to the original. The functional surface is tiny — a single lookup table — but the workload is brutally asymmetric: ~1000 reads per write, ~600k RPS at peak, sub-100ms redirects, and a hard guarantee that every short code maps to exactly one URL.<\u002Fp>\n          <\u002Fdiv>\n\n          <!-- depth switch -->\n          <div style=\"background:#fff;border:1px solid hsl(220 15% 88%);border-radius:12px;box-shadow:0 1px 2px 0 rgb(0 0 0/.05);overflow:hidden\">\n            <div style=\"display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:1px solid hsl(220 15% 88%)\">\n              <div>\n                <div style=\"font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:hsl(220 10% 50%)\">Depth<\u002Fdiv>\n                <div style=\"font-size:13px;color:hsl(220 10% 50%);margin-top:1px\">One level at a time. You can't skip ahead until the level below is checked off.<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"margin-left:auto;display:flex;background:hsl(220 15% 96%);border-radius:9999px;padding:3px\">\n                <sc-for list=\"{{ depths }}\" as=\"d\" hint-placeholder-count=\"3\">\n                  <button sc-camel-on-click=\"{{ d.onSelect }}\" style=\"border:0;cursor:pointer;padding:6px 14px;border-radius:9999px;font-size:12.5px;font-weight:600;background:{{ d.bg }};color:{{ d.fg }};box-shadow:{{ d.sh }}\">{{ d.label }}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"padding:18px 20px\">\n              <sc-if value=\"{{ depthLayman }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"max-width:74ch\">\n                <h2 style=\"margin:0 0 10px;font-size:20px;font-weight:700\">The valet ticket<\u002Fh2>\n                <p style=\"margin:0 0 12px;font-size:15px;line-height:1.65\">Imagine you pull up to a fancy restaurant with a long, complicated car. You hand the keys to the valet and they hand you back a tiny ticket: <code style=\"font-family:ui-monospace,Menlo,monospace;font-size:13.5px;background:hsl(220 15% 96%);padding:1px 5px;border-radius:4px\">#A47<\u002Fcode>. That ticket means absolutely nothing on its own — it's not your car, it's not even a description of your car. It's just a lookup key.<\u002Fp>\n                <p style=\"margin:0 0 12px;font-size:15px;line-height:1.65\">The long URL is your car. The short code is the ticket. Bitly's job is to remember which ticket points to which car, and to fetch the right one when you come back.<\u002Fp>\n                <div style=\"border-radius:12px;background:hsl(0 100% 97%);border:1px solid hsl(0 84% 85%);padding:12px 14px;margin:16px 0\">\n                  <div style=\"font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:hsl(0 70% 42%);margin-bottom:5px\">Where the analogy breaks down<\u002Fdiv>\n                  <div style=\"font-size:14px;line-height:1.6;color:hsl(220 15% 25%)\">Real Bitly serves billions of clicks per day and must survive bots, scrapers and phishing URLs. The \"valet\" is a globally distributed cluster of caches and CDN edge nodes — not one person with a clipboard. The ticket has to be retrievable in under 100ms from anywhere on Earth, which no human valet could match.<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:flex;align-items:center;gap:10px;padding-top:4px\">\n                  <button sc-camel-on-click=\"{{ nextDepth }}\" style=\"border:0;cursor:pointer;background:#2563EB;color:#fff;border-radius:12px;padding:9px 15px;font-size:13px;font-weight:600\">I've got the mental model →<\u002Fbutton>\n                  <span style=\"font-size:12.5px;color:hsl(220 10% 50%)\">Unlocks Core: requirements, entities, API<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <\u002Fsc-if>\n\n              <sc-if value=\"{{ depthCore }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"max-width:80ch\">\n                <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:20px\">\n                  <div>\n                    <div style=\"font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:hsl(220 10% 50%);margin-bottom:8px\">Functional — in scope<\u002Fdiv>\n                    <ol style=\"margin:0;padding-left:20px;font-size:14px;line-height:1.65\">\n                      <li>Submit a long URL, receive a shortened URL.<\u002Fli>\n                      <li>Optionally specify a custom alias (<code style=\"font-family:ui-monospace,Menlo,monospace;font-size:13px\">short.ly/my-team<\u002Fcode>).<\u002Fli>\n                      <li>Optionally specify an expiration date.<\u002Fli>\n                      <li>Anyone visiting a short URL is redirected to the original.<\u002Fli>\n                    <\u002Fol>\n                  <\u002Fdiv>\n                  <div>\n                    <div style=\"font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:hsl(220 10% 50%);margin-bottom:8px\">Non-functional<\u002Fdiv>\n                    <ol style=\"margin:0;padding-left:20px;font-size:14px;line-height:1.65\">\n                      <li>1B URLs stored, 100M DAU.<\u002Fli>\n                      <li>~500M redirects/day → 5.8k RPS avg, 600k RPS peak.<\u002Fli>\n                      <li>Read:write ≈ 1000:1 — the dominant pressure.<\u002Fli>\n                      <li>Redirects &lt;100ms; availability 99.99%.<\u002Fli>\n                    <\u002Fol>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n\n                <h3 style=\"margin:0 0 8px;font-size:16px;font-weight:600\">API<\u002Fh3>\n                <pre style=\"margin:0 0 18px;background:#0B1220;color:#D7E1F5;border-radius:12px;padding:14px 16px;font-family:ui-monospace,Menlo,monospace;font-size:13px;line-height:1.6;overflow:auto\">POST /urls\n{ \"long_url\": \"https://example.com/some/very/long/url\",\n  \"custom_alias\": \"optional\", \"expiration_date\": \"optional\" }\n-&gt; { \"short_url\": \"http://short.ly/abc123\" }\n\nGET /{short_code}\n-&gt; HTTP 302 Redirect to the original long URL<\u002Fpre>\n\n                <!-- NFR -> decision trace -->\n                <div style=\"border:1px solid hsl(220 15% 88%);border-radius:12px;padding:14px 16px;margin-bottom:18px\">\n                  <div style=\"display:flex;align-items:baseline;gap:10px;margin-bottom:3px\">\n                    <div style=\"font-size:15px;font-weight:700\">Why is this component here?<\u002Fdiv>\n                    <div style=\"font-size:12.5px;color:hsl(220 10% 50%)\">Click a requirement — the architecture it forced lights up.<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"display:grid;grid-template-columns:250px 1fr;gap:18px;margin-top:12px;align-items:start\">\n                    <div style=\"display:flex;flex-direction:column;gap:6px\">\n                      <sc-for list=\"{{ nfrs }}\" as=\"n\" hint-placeholder-count=\"4\">\n                        <button sc-camel-on-click=\"{{ n.onSelect }}\" style=\"cursor:pointer;text-align:left;padding:8px 10px;border-radius:8px;font-size:13px;line-height:1.4;border:1px solid {{ n.bc }};background:{{ n.bg }};color:{{ n.fg }};font-weight:{{ n.fw }}\">{{ n.label }}<\u002Fbutton>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                    <div>\n                      <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n                        <sc-for list=\"{{ components }}\" as=\"c\" hint-placeholder-count=\"8\">\n                          <div style=\"border-radius:10px;padding:8px 11px;font-size:12.5px;font-weight:600;border:1px solid {{ c.bc }};background:{{ c.bg }};color:{{ c.fg }};opacity:{{ c.op }}\">{{ c.label }}<\u002Fdiv>\n                        <\u002Fsc-for>\n                      <\u002Fdiv>\n                      <div style=\"margin-top:12px;font-size:13.5px;line-height:1.6;padding-left:12px;border-left:2px solid #2563EB;color:hsl(220 15% 25%)\">{{ nfrBecause }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n\n                <div style=\"display:flex;align-items:center;gap:10px\">\n                  <button sc-camel-on-click=\"{{ nextDepth }}\" style=\"border:0;cursor:pointer;background:#2563EB;color:#fff;border-radius:12px;padding:9px 15px;font-size:13px;font-weight:600\">Go deeper →<\u002Fbutton>\n                  <span style=\"font-size:12.5px;color:hsl(220 10% 50%)\">7 deep dives, the scaling journey, and 8 insider traps<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <\u002Fsc-if>\n\n              <sc-if value=\"{{ depthDeep }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"max-width:80ch\">\n\n                <!-- predict before reveal -->\n                <div style=\"border:1px solid hsl(220 15% 88%);border-radius:12px;overflow:hidden;margin-bottom:20px\">\n                  <div style=\"padding:14px 16px;background:hsl(220 100% 97%);border-bottom:1px solid hsl(220 15% 88%)\">\n                    <div style=\"font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:#1D4ED8;margin-bottom:5px\">Predict before you read · 1 of 5<\u002Fdiv>\n                    <div style=\"font-size:16px;font-weight:600;line-height:1.45\">Bitly returns a 302, not a 301. Commit to a reason before you scroll.<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"padding:14px 16px\">\n                    <sc-if value=\"{{ notRevealed302 }}\" hint-placeholder-val=\"{{ true }}\">\n                    <div>\n                      <textarea placeholder=\"Two sentences is plenty. Guessing wrong is the point — it's what makes the answer stick.\" style=\"width:100%;min-height:74px;resize:vertical;border:1px solid hsl(220 15% 88%);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.55;color:hsl(220 15% 20%);outline:none\"><\u002Ftextarea>\n                      <div style=\"position:relative;margin-top:12px;border-radius:12px;overflow:hidden\">\n                        <div style=\"filter:blur(6px);user-select:none;font-size:14px;line-height:1.6;color:hsl(220 10% 45%);padding:12px 14px;background:hsl(220 15% 96%)\">301 is a permanent redirect. Browsers cache it indefinitely and clearing it requires the user to manually purge their browser cache. Once a user's browser has seen the 301, every future click goes directly to the destination without ever reaching your servers.<\u002Fdiv>\n                        <div style=\"position:absolute;inset:0;display:flex;align-items:center;justify-content:center\">\n                          <button sc-camel-on-click=\"{{ reveal302 }}\" style=\"border:0;cursor:pointer;background:#2563EB;color:#fff;border-radius:9999px;padding:8px 18px;font-size:13px;font-weight:600;box-shadow:0 4px 6px -1px rgb(0 0 0/.1)\">Reveal answer<\u002Fbutton>\n                        <\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                    <\u002Fsc-if>\n                    <sc-if value=\"{{ revealed302 }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"animation:fadeIn .2s ease\">\n                      <div style=\"font-size:14.5px;line-height:1.65;color:hsl(220 15% 22%)\">301 is permanent — browsers cache it indefinitely, and clearing it requires the user to purge their cache manually. Once a browser has seen the 301, every future click goes straight to the destination and never reaches your servers. You permanently lose click analytics, the ability to change the destination, and the ability to revoke the link. 302 is temporary and not browser-cached, so every click routes through your server: trackable, updatable, revocable.<\u002Fdiv>\n                      <div style=\"display:flex;gap:8px;margin-top:14px;flex-wrap:wrap\">\n                        <button style=\"cursor:pointer;border:1px solid hsl(158 64% 60%);background:hsl(158 64% 52% / .12);color:hsl(158 64% 28%);border-radius:9999px;padding:6px 14px;font-size:12.5px;font-weight:600\">I had it<\u002Fbutton>\n                        <button style=\"cursor:pointer;border:1px solid hsl(38 90% 60%);background:hsl(38 90% 62% / .16);color:hsl(38 70% 30%);border-radius:9999px;padding:6px 14px;font-size:12.5px;font-weight:600\">Partly — queue it<\u002Fbutton>\n                        <button style=\"cursor:pointer;border:1px solid hsl(0 84% 78%);background:hsl(0 84% 60% / .12);color:hsl(0 70% 40%);border-radius:9999px;padding:6px 14px;font-size:12.5px;font-weight:600\">Missed it — drill tomorrow<\u002Fbutton>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n\n                <!-- collision math -->\n                <h3 style=\"margin:0 0 8px;font-size:17px;font-weight:600\">Hash collision is not your hot-path problem<\u002Fh3>\n                <p style=\"margin:0 0 10px;font-size:14.5px;line-height:1.65\">A common mistake is proposing a read-before-write on every insert to check whether a generated code already exists. That adds a DB round-trip to every write and creates a time-of-check/time-of-use race.<\u002Fp>\n                <div style=\"display:flex;gap:10px;flex-wrap:wrap;margin:0 0 12px\">\n                  <sc-for list=\"{{ collisionNums }}\" as=\"k\" hint-placeholder-count=\"3\">\n                    <div style=\"flex:1 1 150px;border:1px solid hsl(220 15% 88%);border-radius:12px;padding:10px 12px\">\n                      <div style=\"font-size:20px;font-weight:700;font-family:ui-monospace,Menlo,monospace;letter-spacing:-.02em;color:#1D4ED8\">{{ k.value }}<\u002Fdiv>\n                      <div style=\"font-size:12px;color:hsl(220 10% 50%);line-height:1.4;margin-top:2px\">{{ k.label }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <p style=\"margin:0 0 20px;font-size:14.5px;line-height:1.65\">The correct approach is optimistic concurrency: generate the code, attempt the insert, catch the unique constraint violation, regenerate with a nonce, retry. Zero overhead on the 99.999972% of writes that don't collide.<\u002Fp>\n\n                <!-- scaling stage slider -->\n                <div style=\"border:1px solid hsl(220 15% 88%);border-radius:12px;padding:16px;margin-bottom:20px;background:linear-gradient(135deg, hsl(220 100% 97%) 0%, hsl(158 60% 97%) 100%)\">\n                  <div style=\"display:flex;align-items:baseline;gap:10px;margin-bottom:2px\">\n                    <div style=\"font-size:16px;font-weight:700\">Scaling journey<\u002Fdiv>\n                    <div style=\"font-size:12.5px;color:hsl(220 10% 50%)\">Drag. Read the failure that forced the next stage — that's the interview answer.<\u002Fdiv>\n                  <\u002Fdiv>\n                  <input type=\"range\" min=\"0\" max=\"4\" step=\"1\" value=\"{{ stage }}\" sc-camel-on-change=\"{{ setStage }}\" style=\"width:100%;margin:14px 0 6px;accent-color:#2563EB\">\n                  <div style=\"display:flex;justify-content:space-between;margin-bottom:14px\">\n                    <sc-for list=\"{{ stageTicks }}\" as=\"s\" hint-placeholder-count=\"5\">\n                      <div style=\"font-size:11px;font-weight:600;color:{{ s.fg }};text-align:center;flex:1\">{{ s.label }}<\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                  <div style=\"background:#fff;border:1px solid hsl(220 15% 88%);border-radius:12px;padding:14px 16px\">\n                    <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:8px\">\n                      <span style=\"border-radius:9999px;padding:2px 9px;font-size:11.5px;font-weight:600;background:hsl(220 100% 97%);color:#1D4ED8\">Stage {{ stageNum }}<\u002Fspan>\n                      <span style=\"font-size:15px;font-weight:700\">{{ stageTitle }}<\u002Fspan>\n                      <span style=\"font-size:12.5px;color:hsl(220 10% 50%);margin-left:auto\">{{ stageUsers }}<\u002Fspan>\n                    <\u002Fdiv>\n                    <div style=\"font-size:13.5px;line-height:1.6;margin-bottom:10px\">{{ stageArch }}<\u002Fdiv>\n                    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px\">\n                      <div style=\"padding-left:12px;border-left:2px solid hsl(158 64% 52%)\">\n                        <div style=\"font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:hsl(158 64% 38%);margin-bottom:3px\">What you skip<\u002Fdiv>\n                        <div style=\"font-size:13px;line-height:1.5\">{{ stageSkip }}<\u002Fdiv>\n                      <\u002Fdiv>\n                      <div style=\"padding-left:12px;border-left:2px solid hsl(0 70% 50%)\">\n                        <div style=\"font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:hsl(0 70% 42%);margin-bottom:3px\">Failure that forces the next stage<\u002Fdiv>\n                        <div style=\"font-size:13px;line-height:1.5\">{{ stageFail }}<\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n\n                <!-- tradeoff matrix -->\n                <div style=\"border:1px solid hsl(220 15% 88%);border-radius:12px;padding:16px;margin-bottom:20px\">\n                  <div style=\"display:flex;align-items:baseline;gap:10px;margin-bottom:2px\">\n                    <div style=\"font-size:16px;font-weight:700\">Fill the tradeoff matrix<\u002Fdiv>\n                    <div style=\"font-size:12.5px;color:hsl(220 10% 50%)\">Say your answer out loud, then tap the cell. From <a href=\"#\">Design Facebook News Feed<\u002Fa>.<\u002Fdiv>\n                    <div style=\"margin-left:auto;font-size:12.5px;font-weight:600;color:{{ matrixFg }}\">{{ matrixProgress }}<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"display:grid;grid-template-columns:1.15fr 1fr 1fr 1fr;gap:6px;margin-top:12px\">\n                    <sc-for list=\"{{ matrixCells }}\" as=\"c\" hint-placeholder-count=\"24\">\n                      <div sc-camel-on-click=\"{{ c.onSelect }}\" style=\"border-radius:8px;padding:9px 10px;font-size:12.5px;line-height:1.4;min-height:44px;display:flex;align-items:center;cursor:{{ c.cursor }};border:1px solid {{ c.bc }};background:{{ c.bg }};color:{{ c.fg }};font-weight:{{ c.fw }}\">{{ c.text }}<\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n\n                <!-- diagram placeholder -->\n                <div style=\"border:1px dashed hsl(220 15% 80%);border-radius:12px;padding:20px;text-align:center;background:hsl(220 15% 96% / .5)\">\n                  <div style=\"font-size:13px;font-weight:600;color:hsl(220 10% 45%);margin-bottom:3px\">Reference diagram — vault asset<\u002Fdiv>\n                  <div style=\"font-size:12px;color:hsl(220 10% 50%);font-family:ui-monospace,Menlo,monospace\">ProblemBreakdowns/assets/5RYoohUD8Vib.03jb3i4dzpdqv.svg<\u002Fdiv>\n                  <div style=\"font-size:12.5px;color:hsl(220 10% 50%);margin-top:8px;line-height:1.5\">Diagrams stay blurred until you've sketched your own — pattern-matching a picture feels like understanding and isn't.<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- right rail -->\n        <div style=\"position:sticky;top:86px;display:flex;flex-direction:column;gap:12px\">\n          <div style=\"background:#fff;border:1px solid hsl(220 15% 88%);border-radius:12px;box-shadow:0 1px 2px 0 rgb(0 0 0/.05);padding:14px\">\n            <div style=\"font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:hsl(220 10% 50%);margin-bottom:9px\">Comprehension<\u002Fdiv>\n            <div style=\"font-size:26px;font-weight:700;line-height:1;color:hsl(38 90% 52%)\">3<span style=\"font-size:15px;color:hsl(220 10% 50%);font-weight:500\">/5 checks<\u002Fspan><\u002Fdiv>\n            <div style=\"height:6px;border-radius:9999px;background:hsl(220 15% 96%);overflow:hidden;margin:10px 0 12px\"><div style=\"height:100%;background:hsl(38 90% 62%);width:60%;border-radius:9999px\"><\u002Fdiv><\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:7px\">\n              <sc-for list=\"{{ checks }}\" as=\"c\" hint-placeholder-count=\"5\">\n                <div style=\"display:flex;gap:7px;align-items:flex-start;font-size:12.5px;line-height:1.4;color:{{ c.fg }}\">\n                  <i data-lucide=\"{{ c.icon }}\" style=\"flex:0 0 16px;margin-top:1px;color:{{ c.iconFg }}\"><\u002Fi>\n                  <span>{{ c.label }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#fff;border:1px solid hsl(220 15% 88%);border-radius:12px;box-shadow:0 1px 2px 0 rgb(0 0 0/.05);padding:14px\">\n            <div style=\"font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:hsl(220 10% 50%);margin-bottom:9px\">Related concepts<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:8px\">\n              <sc-for list=\"{{ related }}\" as=\"r\" hint-placeholder-count=\"6\">\n                <button sc-camel-on-click=\"{{ goConcepts }}\" style=\"text-align:left;cursor:pointer;border:0;background:transparent;padding:0;display:flex;align-items:center;gap:8px\">\n                  <span style=\"width:6px;height:6px;border-radius:9999px;flex:0 0 6px;background:{{ r.color }}\"><\u002Fspan>\n                  <span style=\"font-size:13px;font-weight:500;color:hsl(220 15% 20%);flex:1\">{{ r.name }}<\u002Fspan>\n                  <span style=\"font-size:11px;font-weight:700;color:{{ r.color }}\">{{ r.score }}<\u002Fspan>\n                <\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <button sc-camel-on-click=\"{{ goPractice }}\" style=\"border:0;cursor:pointer;background:#2563EB;color:#fff;border-radius:12px;padding:11px;font-size:13px;font-weight:600\">Practice this problem<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ================= PRACTICE ================= -->\n      <sc-if value=\"{{ isPractice }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;flex-direction:column;gap:14px\">\n\n        <div style=\"display:flex;gap:8px;flex-wrap:wrap;align-items:center\">\n          <sc-for list=\"{{ variants }}\" as=\"v\" hint-placeholder-count=\"3\">\n            <button sc-camel-on-click=\"{{ v.onSelect }}\" style=\"cursor:pointer;text-align:left;flex:1 1 240px;border-radius:12px;padding:10px 14px;border:1px solid {{ v.bc }};background:{{ v.bg }};box-shadow:{{ v.sh }}\">\n              <div style=\"font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:{{ v.tag }}\">Take {{ v.key }}<\u002Fdiv>\n              <div style=\"font-size:14px;font-weight:600;color:hsl(220 15% 20%);margin-top:2px\">{{ v.title }}<\u002Fdiv>\n              <div style=\"font-size:12.5px;color:hsl(220 10% 50%);line-height:1.4;margin-top:2px\">{{ v.blurb }}<\u002Fdiv>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <!-- ---- Take A: phase-timed room ---- -->\n        <sc-if value=\"{{ variantA }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display:grid;grid-template-columns:212px minmax(0,1fr) 250px;gap:14px;align-items:start\">\n\n          <div style=\"background:#fff;border:1px solid hsl(220 15% 88%);border-radius:12px;box-shadow:0 1px 2px 0 rgb(0 0 0/.05);padding:14px\">\n            <div style=\"display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px\">\n              <div style=\"font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:hsl(220 10% 50%)\">Phases<\u002Fdiv>\n              <div style=\"font-size:16px;font-weight:700;font-family:ui-monospace,Menlo,monospace;color:hsl(220 15% 20%)\">18:42<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:4px\">\n              <sc-for list=\"{{ phases }}\" as=\"p\" hint-placeholder-count=\"5\">\n                <div style=\"border-radius:8px;padding:8px 10px;border:1px solid {{ p.bc }};background:{{ p.bg }}\">\n                  <div style=\"display:flex;align-items:center;gap:6px\">\n                    <i data-lucide=\"{{ p.icon }}\" style=\"flex:0 0 16px;color:{{ p.iconFg }}\"><\u002Fi>\n                    <span style=\"font-size:13px;font-weight:{{ p.fw }};flex:1;color:{{ p.fg }}\">{{ p.label }}<\u002Fspan>\n                    <span style=\"font-size:11.5px;font-family:ui-monospace,Menlo,monospace;color:{{ p.timeFg }}\">{{ p.time }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"height:4px;border-radius:9999px;background:hsl(220 15% 92%);overflow:hidden;margin-top:6px\">\n                    <div style=\"height:100%;border-radius:9999px;background:{{ p.barFg }};width:{{ p.w }}\"><\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"margin-top:12px;padding-top:12px;border-top:1px solid hsl(220 15% 88%);font-size:12.5px;line-height:1.5;color:hsl(220 10% 50%)\">You're 4 min over on High-Level Design. In a real loop that's the deep-dive time you're borrowing.<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display:flex;flex-direction:column;gap:14px;min-width:0\">\n            <div style=\"background:#fff;border:1px solid hsl(220 15% 88%);border-radius:12px;box-shadow:0 1px 2px 0 rgb(0 0 0/.05);padding:16px 18px\">\n              <div style=\"display:flex;gap:8px;align-items:center;margin-bottom:10px\">\n                <span style=\"border-radius:9999px;padding:2px 9px;font-size:11.5px;font-weight:600;background:hsl(0 100% 97%);color:hsl(0 70% 42%)\">Deep dive 3 of 7<\u002Fspan>\n                <span style=\"font-size:12.5px;color:hsl(220 10% 50%)\">Design Bitly · answering as {{ level }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"font-size:18px;font-weight:600;line-height:1.45;margin-bottom:14px;text-wrap:pretty\">You've got Redis in front of Postgres. A single link goes viral and hits 600k RPS in one region. Walk me through what happens to your read path — and what breaks first.<\u002Fdiv>\n              <textarea placeholder=\"Type as you talk. The rubric on the right ticks itself as you cover each point.\" style=\"width:100%;min-height:180px;resize:vertical;border:1px solid hsl(220 15% 88%);border-radius:12px;padding:12px 14px;font-size:14.5px;line-height:1.65;outline:none;color:hsl(220 15% 20%)\">Reads hit the CDN edge first — for a viral link the hot set is a single key, so edge cache absorbs almost all of it and origin only sees misses and TTL expiries. What breaks first is the miss window: when the edge entry expires, thousands of concurrent misses hit regional Redis simultaneously —<\u002Ftextarea>\n              <div style=\"display:flex;align-items:center;gap:10px;margin-top:12px\">\n                <button sc-camel-on-click=\"{{ goReview }}\" style=\"border:0;cursor:pointer;background:#2563EB;color:#fff;border-radius:12px;padding:9px 15px;font-size:13px;font-weight:600\">Submit for scoring<\u002Fbutton>\n                <button style=\"cursor:pointer;background:#fff;border:1px solid hsl(220 15% 88%);border-radius:12px;padding:9px 15px;font-size:13px;font-weight:600;color:hsl(220 15% 20%)\">Next hint<\u002Fbutton>\n                <span style=\"font-size:12.5px;color:hsl(220 10% 50%);margin-left:auto\">248 words · 2 of 4 rubric points covered<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"background:#fff;border:1px solid hsl(220 15% 88%);border-radius:12px;box-shadow:0 1px 2px 0 rgb(0 0 0/.05);padding:14px 18px\">\n              <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:10px\">\n                <div style=\"width:24px;height:24px;border-radius:9999px;background:linear-gradient(135deg, hsl(220 70% 50%) 0%, hsl(220 70% 35%) 100%);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700\">AI<\u002Fdiv>\n                <div style=\"font-size:13px;font-weight:600\">Interviewer<\u002Fdiv>\n                <div style=\"display:flex;gap:3px;align-items:center;margin-left:4px\">\n                  <span style=\"width:4px;height:4px;border-radius:9999px;background:hsl(220 10% 60%);animation:dot 1.2s infinite\"><\u002Fspan>\n                  <span style=\"width:4px;height:4px;border-radius:9999px;background:hsl(220 10% 60%);animation:dot 1.2s infinite .15s\"><\u002Fspan>\n                  <span style=\"width:4px;height:4px;border-radius:9999px;background:hsl(220 10% 60%);animation:dot 1.2s infinite .3s\"><\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:8px\">\n                <sc-for list=\"{{ followups }}\" as=\"f\" hint-placeholder-count=\"3\">\n                  <div style=\"border-radius:12px;padding:10px 12px;font-size:13.5px;line-height:1.55;background:{{ f.bg }};border:1px solid {{ f.bc }};color:{{ f.fg }}\">\n                    <span style=\"font-weight:600\">{{ f.tag }}<\u002Fspan> {{ f.text }}\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display:flex;flex-direction:column;gap:12px;position:sticky;top:86px\">\n            <div style=\"background:#fff;border:1px solid hsl(220 15% 88%);border-radius:12px;box-shadow:0 1px 2px 0 rgb(0 0 0/.05);padding:14px\">\n              <div style=\"font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:hsl(220 10% 50%);margin-bottom:3px\">Rubric · {{ level }}<\u002Fdiv>\n              <div style=\"font-size:12.5px;color:hsl(220 10% 50%);line-height:1.45;margin-bottom:11px\">{{ rubricNote }}<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:9px\">\n                <sc-for list=\"{{ rubric }}\" as=\"r\" hint-placeholder-count=\"4\">\n                  <div style=\"display:flex;gap:8px;align-items:flex-start\">\n                    <i data-lucide=\"{{ r.icon }}\" style=\"flex:0 0 16px;margin-top:2px;color:{{ r.iconFg }}\"><\u002Fi>\n                    <div style=\"font-size:13px;line-height:1.45;color:{{ r.fg }}\">{{ r.label }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background:#fff;border:1px solid hsl(220 15% 88%);border-radius:12px;box-shadow:0 1px 2px 0 rgb(0 0 0/.05);padding:14px\">\n              <div style=\"font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:hsl(220 10% 50%);margin-bottom:9px\">Hint ladder<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:7px\">\n                <div style=\"border-radius:8px;padding:9px 10px;background:hsl(220 100% 97%);border:1px solid hsl(220 33% 88%);font-size:12.5px;line-height:1.5;color:hsl(220 15% 25%)\"><span style=\"font-weight:600\">1 ·<\u002Fspan> The problem isn't throughput. It's what N concurrent misses do to one key.<\u002Fdiv>\n                <div style=\"border-radius:8px;padding:9px 10px;background:hsl(220 15% 96%);border:1px solid hsl(220 15% 90%);font-size:12.5px;line-height:1.5;color:hsl(220 10% 55%);display:flex;gap:7px;align-items:center\"><i data-lucide=\"lock\" style=\"flex:0 0 16px\"><\u002Fi> 2 · Costs 3 mastery points<\u002Fdiv>\n                <div style=\"border-radius:8px;padding:9px 10px;background:hsl(220 15% 96%);border:1px solid hsl(220 15% 90%);font-size:12.5px;line-height:1.5;color:hsl(220 10% 55%);display:flex;gap:7px;align-items:center\"><i data-lucide=\"lock\" style=\"flex:0 0 16px\"><\u002Fi> 3 · Names the mechanism outright<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- ---- Take B: whiteboard builder ---- -->\n        <sc-if value=\"{{ variantB }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:grid;grid-template-columns:186px minmax(0,1fr) 250px;gap:14px;align-items:start\">\n\n          <div style=\"background:#fff;border:1px solid hsl(220 15% 88%);border-radius:12px;box-shadow:0 1px 2px 0 rgb(0 0 0/.05);padding:14px\">\n            <div style=\"font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:hsl(220 10% 50%);margin-bottom:3px\">Palette<\u002Fdiv>\n            <div style=\"font-size:12.5px;color:hsl(220 10% 50%);line-height:1.45;margin-bottom:11px\">Drag onto the canvas. Nothing is labelled \"correct\" — you justify it after.<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:5px\">\n              <sc-for list=\"{{ palette }}\" as=\"c\" hint-placeholder-count=\"10\">\n                <div style=\"display:flex;align-items:center;gap:8px;border:1px solid hsl(220 15% 88%);border-radius:8px;padding:7px 9px;cursor:grab;background:#fff\">\n                  <span style=\"width:8px;height:8px;border-radius:2px;flex:0 0 8px;background:{{ c.color }}\"><\u002Fspan>\n                  <span style=\"font-size:12.5px;font-weight:500;flex:1\">{{ c.label }}<\u002Fspan>\n                  <span style=\"font-size:11px;color:hsl(220 10% 55%)\">{{ c.used }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"background:#fff;border:1px solid hsl(220 15% 88%);border-radius:12px;box-shadow:0 1px 2px 0 rgb(0 0 0/.05);overflow:hidden\">\n            <div style=\"display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid hsl(220 15% 88%)\">\n              <div style=\"font-size:13.5px;font-weight:600\">Whiteboard · Design Bitly<\u002Fdiv>\n              <div style=\"font-size:12.5px;color:hsl(220 10% 50%)\">Redirect path selected<\u002Fdiv>\n              <div style=\"margin-left:auto;display:flex;gap:6px\">\n                <button style=\"cursor:pointer;border:1px solid hsl(220 15% 88%);background:#fff;border-radius:9999px;padding:4px 11px;font-size:12px;font-weight:600;color:hsl(220 15% 20%)\">Write path<\u002Fbutton>\n                <button style=\"cursor:pointer;border:1px solid #2563EB;background:hsl(220 100% 97%);border-radius:9999px;padding:4px 11px;font-size:12px;font-weight:600;color:#1D4ED8\">Read path<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"position:relative;height:398px;background-image:radial-gradient(hsl(220 15% 88%) 1px, transparent 1px);background-size:18px 18px;background-color:hsl(220 100% 99%)\">\n              <svg style=\"position:absolute;inset:0;width:100%;height:100%;overflow:visible\">\n                <sc-for list=\"{{ canvasEdges }}\" as=\"e\" hint-placeholder-count=\"4\">\n                  <line x1=\"{{ e.x1 }}\" y1=\"{{ e.y1 }}\" x2=\"{{ e.x2 }}\" y2=\"{{ e.y2 }}\" stroke=\"hsl(220 15% 62%)\" stroke-width=\"1.5\" stroke-dasharray=\"{{ e.dash }}\"><\u002Fline>\n                <\u002Fsc-for>\n              <\u002Fsvg>\n              <sc-for list=\"{{ canvasNodes }}\" as=\"n\" hint-placeholder-count=\"5\">\n                <div style=\"position:absolute;transform:translate(-50%,-50%);border-radius:10px;padding:8px 11px;background:#fff;box-shadow:0 4px 6px -1px rgb(0 0 0/.1);white-space:nowrap;border:1px solid {{ n.bc }};left:{{ n.x }};top:{{ n.y }}\">\n                  <div style=\"font-size:12.5px;font-weight:600;color:hsl(220 15% 20%)\">{{ n.label }}<\u002Fdiv>\n                  <div style=\"font-size:11px;color:hsl(220 10% 50%);margin-top:1px\">{{ n.sub }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <div style=\"position:absolute;left:14%;top:64%;transform:translate(-50%,-50%);max-width:200px;white-space:normal;text-align:center;line-height:1.4;border:1.5px dashed hsl(220 70% 60%);border-radius:10px;padding:9px 12px;background:hsl(220 100% 97% / .8);color:#1D4ED8;font-size:12.5px;font-weight:600\">Drop here — the reference has a component you're missing<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display:flex;flex-direction:column;gap:12px;position:sticky;top:86px\">\n            <div style=\"background:#fff;border:1px solid hsl(220 15% 88%);border-radius:12px;box-shadow:0 1px 2px 0 rgb(0 0 0/.05);padding:14px\">\n              <div style=\"font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:hsl(220 10% 50%);margin-bottom:8px\">Coverage<\u002Fdiv>\n              <div style=\"font-size:26px;font-weight:700;line-height:1;color:hsl(38 90% 52%)\">6<span style=\"font-size:15px;font-weight:500;color:hsl(220 10% 50%)\">/9 components<\u002Fspan><\u002Fdiv>\n              <div style=\"height:6px;border-radius:9999px;background:hsl(220 15% 96%);overflow:hidden;margin:10px 0 12px\"><div style=\"height:100%;background:hsl(38 90% 62%);width:67%;border-radius:9999px\"><\u002Fdiv><\u002Fdiv>\n              <div style=\"font-size:12.5px;line-height:1.5;color:hsl(220 10% 50%)\">Coverage is a hint, not a grade. A tight 6-box design that names its tradeoffs beats a 12-box diagram you can't defend.<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background:#fff;border:1px solid hsl(220 15% 88%);border-radius:12px;box-shadow:0 1px 2px 0 rgb(0 0 0/.05);padding:14px\">\n              <div style=\"font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:hsl(220 10% 50%);margin-bottom:10px\">Requirements satisfied<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:9px\">\n                <sc-for list=\"{{ reqChecks }}\" as=\"r\" hint-placeholder-count=\"5\">\n                  <div style=\"display:flex;gap:8px;align-items:flex-start\">\n                    <i data-lucide=\"{{ r.icon }}\" style=\"flex:0 0 16px;margin-top:2px;color:{{ r.iconFg }}\"><\u002Fi>\n                    <div style=\"font-size:13px;line-height:1.45;color:{{ r.fg }}\">{{ r.label }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <button sc-camel-on-click=\"{{ goReview }}\" style=\"border:0;cursor:pointer;background:#2563EB;color:#fff;border-radius:12px;padding:11px;font-size:13px;font-weight:600\">Defend this design<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- ---- Take C: socratic drill ---- -->\n        <sc-if value=\"{{ variantC }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:14px;align-items:start\">\n          <div style=\"display:flex;flex-direction:column;gap:14px;min-width:0\">\n            <div style=\"background:#fff;border:1px solid hsl(220 15% 88%);border-radius:12px;box-shadow:0 1px 2px 0 rgb(0 0 0/.05);padding:12px 16px;display:flex;align-items:center;gap:12px\">\n              <div style=\"font-size:12.5px;color:hsl(220 10% 50%)\">Question 7 of ~12 · adapting to you<\u002Fdiv>\n              <div style=\"flex:1;display:flex;gap:3px\">\n                <sc-for list=\"{{ socraticTrail }}\" as=\"t\" hint-placeholder-count=\"12\">\n                  <div style=\"flex:1;height:5px;border-radius:9999px;background:{{ t.bg }}\"><\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"font-size:12.5px;font-weight:600;color:hsl(0 70% 45%)\">Difficulty ↑ Staff<\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"background:#fff;border:1px solid hsl(220 15% 88%);border-radius:12px;box-shadow:0 4px 6px -1px rgb(0 0 0/.1);padding:22px 24px\">\n              <div style=\"display:flex;gap:10px;align-items:center;margin-bottom:14px\">\n                <div style=\"width:26px;height:26px;border-radius:9999px;background:linear-gradient(135deg, hsl(220 70% 50%) 0%, hsl(220 70% 35%) 100%);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700\">AI<\u002Fdiv>\n                <div style=\"font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:hsl(220 10% 50%)\">One question at a time<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font-size:22px;font-weight:600;line-height:1.4;margin-bottom:6px;text-wrap:pretty\">You said you'd shard the URL table by <code style=\"font-family:ui-monospace,Menlo,monospace;font-size:19px;background:hsl(220 15% 96%);padding:1px 6px;border-radius:5px\">hash(short_code)<\u002Fcode>. Your Redis cluster shards by a different key. What goes wrong, and how bad is it?<\u002Fdiv>\n              <div style=\"font-size:13.5px;color:hsl(220 10% 50%);line-height:1.55;margin-bottom:16px\">You cleared reads and writes in three answers, so I skipped ahead. This one is where Staff+ candidates separate.<\u002Fdiv>\n              <textarea placeholder=\"Answer in your own words — half-formed is fine, I'll push on the weak part.\" style=\"width:100%;min-height:120px;resize:vertical;border:1px solid hsl(220 15% 88%);border-radius:

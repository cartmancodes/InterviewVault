12px;padding:12px 14px;font-size:15px;line-height:1.65;outline:none;color:hsl(220 15% 20%)\"><\u002Ftextarea>\n              <div style=\"display:flex;gap:8px;margin-top:12px;align-items:center\">\n                <button style=\"border:0;cursor:pointer;background:#2563EB;color:#fff;border-radius:12px;padding:10px 18px;font-size:13.5px;font-weight:600\">Answer<\u002Fbutton>\n                <button style=\"cursor:pointer;background:#fff;border:1px solid hsl(220 15% 88%);border-radius:12px;padding:10px 16px;font-size:13.5px;font-weight:600;color:hsl(220 15% 20%)\">I don't know — teach me<\u002Fbutton>\n                <span style=\"font-size:12.5px;color:hsl(220 10% 50%);margin-left:auto\">\"I don't know\" costs nothing. Bluffing costs the next 3 questions.<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"background:#fff;border-radius:12px;border:1px solid hsl(220 15% 88%);border-left:2px solid hsl(158 64% 52%);box-shadow:0 1px 2px 0 rgb(0 0 0/.05);padding:14px 16px\">\n              <div style=\"font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:hsl(158 64% 34%);margin-bottom:5px\">Your last answer · 4 of 5<\u002Fdiv>\n              <div style=\"font-size:13.5px;line-height:1.6;color:hsl(220 15% 25%)\">You named the SPOF on the counter node unprompted — that's the Staff-level move. You stopped short of a mitigation. Batched <code style=\"font-family:ui-monospace,Menlo,monospace;font-size:13px\">INCRBY 1000<\u002Fcode> per pod, or disjoint per-region ranges, would have closed it.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display:flex;flex-direction:column;gap:12px;position:sticky;top:86px\">\n            <div style=\"background:#fff;border:1px solid hsl(220 15% 88%);border-radius:12px;box-shadow:0 1px 2px 0 rgb(0 0 0/.05);padding:14px\">\n              <div style=\"font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:hsl(220 10% 50%);margin-bottom:10px\">This session<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:10px\">\n                <sc-for list=\"{{ socraticStats }}\" as=\"s\" hint-placeholder-count=\"4\">\n                  <div style=\"display:flex;justify-content:space-between;align-items:baseline\">\n                    <span style=\"font-size:13px;color:hsl(220 15% 25%)\">{{ s.label }}<\u002Fspan>\n                    <span style=\"font-size:14px;font-weight:700;color:{{ s.color }}\">{{ s.value }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background:#fff;border:1px solid hsl(220 15% 88%);border-radius:12px;box-shadow:0 1px 2px 0 rgb(0 0 0/.05);padding:14px\">\n              <div style=\"font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:hsl(220 10% 50%);margin-bottom:8px\">Queued from this session<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:7px\">\n                <sc-for list=\"{{ queuedCards }}\" as=\"q\" hint-placeholder-count=\"3\">\n                  <div style=\"font-size:12.5px;line-height:1.45;padding-left:10px;border-left:2px solid {{ q.color }};color:hsl(220 15% 25%)\">{{ q.label }}<\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ================= REVIEW ================= -->\n      <sc-if value=\"{{ isReview }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;flex-direction:column;gap:16px\">\n\n        <div style=\"background:#fff;border:1px solid hsl(220 15% 88%);border-radius:12px;box-shadow:0 1px 2px 0 rgb(0 0 0/.05);padding:18px 20px;display:grid;grid-template-columns:200px 1fr;gap:24px;align-items:center\">\n          <div style=\"text-align:center\">\n            <div style=\"font-size:52px;font-weight:700;line-height:1;color:hsl(38 90% 52%)\">71<span style=\"font-size:20px;color:hsl(220 10% 50%);font-weight:500\">/100<\u002Fspan><\u002Fdiv>\n            <div style=\"border-radius:9999px;padding:2px 10px;font-size:12px;font-weight:600;background:hsl(38 90% 62% / .18);color:hsl(38 70% 30%);display:inline-block;margin-top:8px\">Manageable<\u002Fdiv>\n            <div style=\"font-size:12.5px;color:hsl(220 10% 50%);margin-top:8px\">Bitly · 43 min · Senior<\u002Fdiv>\n            <div style=\"font-size:12.5px;font-weight:600;color:hsl(158 64% 38%);margin-top:4px\">↑ 9 from last attempt<\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-size:17px;font-weight:700;margin-bottom:3px\">{{ reviewHeadline }}<\u002Fdiv>\n            <div style=\"font-size:14px;line-height:1.6;color:hsl(220 15% 30%);margin-bottom:14px;text-wrap:pretty\">{{ reviewBody }}<\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:10px\">\n              <sc-for list=\"{{ reviewSections }}\" as=\"s\" hint-placeholder-count=\"6\">\n                <div>\n                  <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px\">\n                    <span style=\"font-size:12.5px\">{{ s.label }}<\u002Fspan>\n                    <span style=\"font-size:12.5px;font-weight:700;color:{{ s.color }}\">{{ s.score }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"height:5px;border-radius:9999px;background:hsl(220 15% 96%);overflow:hidden\"><div style=\"height:100%;border-radius:9999px;background:{{ s.color }};width:{{ s.w }}\"><\u002Fdiv><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start\">\n          <div style=\"background:#fff;border:1px solid hsl(220 15% 88%);border-radius:12px;box-shadow:0 1px 2px 0 rgb(0 0 0/.05);padding:16px 18px\">\n            <div style=\"font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:hsl(220 10% 50%);margin-bottom:10px\">What you said<\u002Fdiv>\n            <div style=\"font-size:14px;line-height:1.75;color:hsl(220 15% 25%)\">Reads hit the CDN edge first — for a viral link the hot set is a single key, so edge cache absorbs almost all of it. <mark style=\"background:hsl(158 64% 52% / .22);color:inherit;padding:1px 2px;border-radius:3px\">What breaks first is the miss window: when the edge entry expires, thousands of concurrent misses hit regional Redis simultaneously<\u002Fmark> and I'd add a read replica behind that. <span style=\"text-decoration:underline;text-decoration-style:wavy;text-decoration-color:hsl(0 70% 55%);text-underline-offset:3px\">Then Postgres serves whatever's left.<\u002Fspan><\u002Fdiv>\n            <div style=\"margin-top:14px;padding-top:12px;border-top:1px solid hsl(220 15% 92%);display:flex;gap:14px;flex-wrap:wrap\">\n              <span style=\"font-size:12px;display:flex;align-items:center;gap:6px;color:hsl(220 10% 50%)\"><span style=\"width:10px;height:10px;border-radius:3px;background:hsl(158 64% 52% / .35)\"><\u002Fspan>Matched the reference<\u002Fspan>\n              <span style=\"font-size:12px;display:flex;align-items:center;gap:6px;color:hsl(220 10% 50%)\"><span style=\"width:10px;height:10px;border-radius:3px;background:hsl(0 70% 55% / .35)\"><\u002Fspan>Vague or unjustified<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#fff;border:1px solid hsl(220 15% 88%);border-radius:12px;box-shadow:0 1px 2px 0 rgb(0 0 0/.05);padding:16px 18px\">\n            <div style=\"font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:hsl(220 10% 50%);margin-bottom:10px\">Reference · your vault<\u002Fdiv>\n            <div style=\"font-size:14px;line-height:1.75;color:hsl(220 15% 25%)\">Tiered caching: edge → regional Redis → per-shard in-memory caches on the read service, with the hot-link working set pinned at the edge. <mark style=\"background:hsl(0 70% 55% / .16);color:inherit;padding:1px 2px;border-radius:3px\">On expiry, request coalescing / single-flight collapses N concurrent misses into one origin fetch<\u002Fmark> — otherwise you get a cache stampede. <mark style=\"background:hsl(0 70% 55% / .16);color:inherit;padding:1px 2px;border-radius:3px\">Redis Cluster shards on the same key as the DB so cache and DB shards line up and skewed routing produces no hot nodes.<\u002Fmark><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div>\n          <div style=\"font-size:15px;font-weight:700;margin-bottom:3px\">Three gaps, ranked by what they cost you<\u002Fdiv>\n          <div style=\"font-size:13px;color:hsl(220 10% 50%);line-height:1.5;margin-bottom:11px\">Not a list of everything you missed — that's demoralising and useless. These are the three that would have changed the interviewer's read of you.<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:9px\">\n            <sc-for list=\"{{ gaps }}\" as=\"g\" hint-placeholder-count=\"3\">\n              <div style=\"background:#fff;border:1px solid hsl(220 15% 88%);border-left:2px solid {{ g.color }};border-radius:12px;box-shadow:0 1px 2px 0 rgb(0 0 0/.05);padding:13px 16px\">\n                <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:4px\">\n                  <span style=\"border-radius:9999px;padding:2px 9px;font-size:11px;font-weight:600;background:{{ g.tagBg }};color:{{ g.tagFg }}\">{{ g.severity }}<\u002Fspan>\n                  <span style=\"font-size:14px;font-weight:600\">{{ g.title }}<\u002Fspan>\n                  <span style=\"font-size:12px;color:hsl(220 10% 50%);margin-left:auto\">{{ g.source }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"font-size:13.5px;line-height:1.6;color:hsl(220 15% 28%)\">{{ g.body }}<\u002Fdiv>\n                <div style=\"display:flex;gap:8px;margin-top:10px\">\n                  <button sc-camel-on-click=\"{{ goDrills }}\" style=\"cursor:pointer;border:1px solid hsl(220 15% 88%);background:#fff;border-radius:9999px;padding:5px 12px;font-size:12px;font-weight:600;color:hsl(220 15% 20%)\">Drill this<\u002Fbutton>\n                  <button sc-camel-on-click=\"{{ goRead }}\" style=\"cursor:pointer;border:1px solid hsl(220 15% 88%);background:#fff;border-radius:9999px;padding:5px 12px;font-size:12px;font-weight:600;color:hsl(220 15% 20%)\">Read the section<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#fff;border:1px solid hsl(220 15% 88%);border-radius:12px;box-shadow:0 1px 2px 0 rgb(0 0 0/.05);padding:16px 18px;display:flex;align-items:center;gap:18px\">\n          <div style=\"flex:1\">\n            <div style=\"font-size:15px;font-weight:700;margin-bottom:2px\">4 cards queued from this session<\u002Fdiv>\n            <div style=\"font-size:13px;color:hsl(220 10% 50%);line-height:1.5\">Cache stampede mitigation · shard-key alignment · 301 vs 302 caching · counter-node SPOF. First review tomorrow, then day 4, then day 11.<\u002Fdiv>\n          <\u002Fdiv>\n          <button sc-camel-on-click=\"{{ goDrills }}\" style=\"border:0;cursor:pointer;background:#2563EB;color:#fff;border-radius:12px;padding:10px 16px;font-size:13px;font-weight:600;white-space:nowrap\">Open drill queue<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ================= DRILLS ================= -->\n      <sc-if value=\"{{ isDrills }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;flex-direction:column;gap:16px;max-width:1000px\">\n\n        <div style=\"display:flex;align-items:center;gap:12px\">\n          <div style=\"font-size:13px;color:hsl(220 10% 50%);flex:1\">{{ drillCoach }}<\u002Fdiv>\n          <div style=\"display:flex;gap:14px\">\n            <sc-for list=\"{{ queueCounts }}\" as=\"q\" hint-placeholder-count=\"3\">\n              <div style=\"text-align:right\">\n                <div style=\"font-size:18px;font-weight:700;line-height:1;color:{{ q.color }}\">{{ q.n }}<\u002Fdiv>\n                <div style=\"font-size:11px;color:hsl(220 10% 50%)\">{{ q.label }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#fff;border:1px solid hsl(220 15% 88%);border-radius:12px;box-shadow:0 4px 6px -1px rgb(0 0 0/.1);padding:28px 30px\">\n          <div style=\"display:flex;gap:8px;align-items:center;margin-bottom:18px\">\n            <span style=\"border-radius:9999px;padding:2px 9px;font-size:11.5px;font-weight:600;background:hsl(220 100% 97%);color:#1D4ED8\">Cloze recall<\u002Fspan>\n            <span style=\"font-size:12.5px;color:hsl(220 10% 50%)\">Design Bitly · Insider tips · seen 3×, missed 1×<\u002Fspan>\n            <span style=\"font-size:12.5px;color:hsl(220 10% 50%);margin-left:auto\">Card 3 of 14<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-size:24px;font-weight:500;line-height:1.55;text-wrap:pretty;margin-bottom:20px\">A natural but wrong instinct is to delete expired URLs eagerly. The correct pattern is <span style=\"display:inline-block;min-width:150px;border-bottom:2px solid #2563EB;background:hsl(220 100% 97%);border-radius:4px;padding:0 8px;color:#1D4ED8;font-weight:600\">?<\u002Fspan> — store <code style=\"font-family:ui-monospace,Menlo,monospace;font-size:21px;background:hsl(220 15% 96%);padding:1px 6px;border-radius:5px\">expires_at<\u002Fcode>, leave the row in place, and check it at <span style=\"display:inline-block;min-width:110px;border-bottom:2px solid #2563EB;background:hsl(220 100% 97%);border-radius:4px;padding:0 8px;color:#1D4ED8;font-weight:600\">?<\u002Fspan>.<\u002Fdiv>\n          <div style=\"border-top:1px solid hsl(220 15% 92%);padding-top:16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap\">\n            <sc-for list=\"{{ grades }}\" as=\"g\" hint-placeholder-count=\"4\">\n              <button style=\"cursor:pointer;border-radius:12px;padding:9px 18px;font-size:13px;font-weight:600;border:1px solid {{ g.bc }};background:{{ g.bg }};color:{{ g.fg }}\">\n                {{ g.label }} <span style=\"opacity:.6;font-weight:500\">{{ g.next }}<\u002Fspan>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n            <span style=\"font-size:12.5px;color:hsl(220 10% 50%);margin-left:auto\">Space to reveal · 1–4 to grade<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start\">\n          <div style=\"background:#fff;border:1px solid hsl(220 15% 88%);border-radius:12px;box-shadow:0 1px 2px 0 rgb(0 0 0/.05);padding:16px 18px\">\n            <div style=\"display:flex;gap:8px;align-items:center;margin-bottom:12px\">\n              <span style=\"border-radius:9999px;padding:2px 9px;font-size:11.5px;font-weight:600;background:hsl(158 64% 52% / .15);color:hsl(158 64% 30%)\">Number sense<\u002Fspan>\n              <span style=\"font-size:12.5px;color:hsl(220 10% 50%);margin-left:auto\">4 in queue<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"font-size:16px;font-weight:600;line-height:1.5;margin-bottom:14px\">500M redirects/day. What's average RPS, and peak at 100×?<\u002Fdiv>\n            <div style=\"display:flex;gap:8px;margin-bottom:12px\">\n              <input value=\"5.8k\" style=\"flex:1;border:1px solid hsl(158 64% 60%);background:hsl(158 64% 52% / .08);border-radius:12px;padding:9px 12px;font-size:15px;font-family:ui-monospace,Menlo,monospace;outline:none;color:hsl(158 64% 26%)\">\n              <input placeholder=\"peak\" style=\"flex:1;border:1px solid hsl(220 15% 88%);border-radius:12px;padding:9px 12px;font-size:15px;font-family:ui-monospace,Menlo,monospace;outline:none;color:hsl(220 15% 20%)\">\n            <\u002Fdiv>\n            <div style=\"font-size:12.5px;line-height:1.5;color:hsl(158 64% 30%);padding-left:10px;border-left:2px solid hsl(158 64% 52%)\">5.8k is inside tolerance (±20%). Order of magnitude is what matters — nobody wants three significant figures on a whiteboard.<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"background:#fff;border:1px solid hsl(220 15% 88%);border-radius:12px;box-shadow:0 1px 2px 0 rgb(0 0 0/.05);padding:16px 18px\">\n            <div style=\"display:flex;gap:8px;align-items:center;margin-bottom:12px\">\n              <span style=\"border-radius:9999px;padding:2px 9px;font-size:11.5px;font-weight:600;background:hsl(0 84% 60% / .13);color:hsl(0 70% 40%)\">Spot the trap<\u002Fspan>\n              <span style=\"font-size:12.5px;color:hsl(220 10% 50%);margin-left:auto\">Built from your insider tips<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"font-size:13.5px;line-height:1.6;color:hsl(220 15% 28%);margin-bottom:12px\">A candidate says: <em>\"I'll dedupe by making the destination URL the primary key, so shortening the same link twice returns the same code.\"<\u002Fem> One sentence: what's wrong?<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:6px\">\n              <sc-for list=\"{{ trapOptions }}\" as=\"t\" hint-placeholder-count=\"3\">\n                <button style=\"cursor:pointer;text-align:left;border-radius:8px;padding:9px 11px;font-size:13px;line-height:1.45;border:1px solid {{ t.bc }};background:{{ t.bg }};color:{{ t.fg }}\">{{ t.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ================= CONCEPTS ================= -->\n      <sc-if value=\"{{ isConcepts }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;flex-direction:column;gap:16px\">\n\n        <div style=\"background:#fff;border:1px solid hsl(220 15% 88%);border-radius:12px;box-shadow:0 1px 2px 0 rgb(0 0 0/.05);overflow:hidden\">\n          <div style=\"padding:14px 18px;border-bottom:1px solid hsl(220 15% 88%);display:flex;align-items:baseline;gap:10px\">\n            <div style=\"font-size:16px;font-weight:700\">Concept map<\u002Fdiv>\n            <div style=\"font-size:12.5px;color:hsl(220 10% 50%)\">Every problem you practise reinforces the concepts under it. Ring colour is your mastery.<\u002Fdiv>\n            <div style=\"font-size:12.5px;color:hsl(220 10% 50%);margin-left:auto\">Centred on Bitly · 8 related<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"position:relative;height:420px;background:linear-gradient(135deg, hsl(220 100% 97%) 0%, hsl(158 60% 97%) 100%)\">\n            <svg sc-camel-view-box=\"0 0 900 420\" sc-camel-preserve-aspect-ratio=\"none\" style=\"position:absolute;inset:0;width:100%;height:100%\">\n              <sc-for list=\"{{ mapEdges }}\" as=\"e\" hint-placeholder-count=\"8\">\n                <line x1=\"450\" y1=\"210\" x2=\"{{ e.x }}\" y2=\"{{ e.y }}\" stroke=\"{{ e.stroke }}\" stroke-width=\"{{ e.sw }}\"><\u002Fline>\n              <\u002Fsc-for>\n            <\u002Fsvg>\n            <div style=\"position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:linear-gradient(135deg, hsl(220 70% 50%) 0%, hsl(220 70% 35%) 100%);color:#fff;border-radius:12px;padding:12px 18px;box-shadow:0 10px 15px -3px rgb(0 0 0/.1);text-align:center\">\n              <div style=\"font-size:15px;font-weight:700\">Design Bitly<\u002Fdiv>\n              <div style=\"font-size:11.5px;opacity:.8\">Read-Heavy · 62/100<\u002Fdiv>\n            <\u002Fdiv>\n            <sc-for list=\"{{ mapNodes }}\" as=\"n\" hint-placeholder-count=\"8\">\n              <div sc-camel-on-click=\"{{ n.onSelect }}\" style=\"position:absolute;transform:translate(-50%,-50%);cursor:pointer;background:#fff;border-radius:9999px;padding:7px 13px;box-shadow:0 1px 2px 0 rgb(0 0 0/.05);display:flex;align-items:center;gap:8px;border:1.5px solid {{ n.color }};left:{{ n.left }};top:{{ n.top }}\">\n                <span style=\"font-size:12.5px;font-weight:600;color:hsl(220 15% 20%);white-space:nowrap\">{{ n.name }}<\u002Fspan>\n                <span style=\"font-size:11px;font-weight:700;color:{{ n.color }}\">{{ n.score }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;align-items:start\">\n          <div style=\"background:#fff;border:1px solid hsl(220 15% 88%);border-radius:12px;box-shadow:0 1px 2px 0 rgb(0 0 0/.05);padding:18px 20px\">\n            <div style=\"display:flex;gap:6px;margin-bottom:10px\">\n              <span style=\"border-radius:9999px;padding:2px 9px;font-size:11.5px;font-weight:600;background:hsl(220 100% 97%);color:#1D4ED8\">Core concept<\u002Fspan>\n              <span style=\"border-radius:9999px;padding:2px 9px;font-size:11.5px;font-weight:600;background:hsl(220 15% 96%);color:hsl(220 10% 40%)\">9 diagrams<\u002Fspan>\n              <span style=\"border-radius:9999px;padding:2px 9px;font-size:11.5px;font-weight:600;background:hsl(0 84% 60% / .13);color:hsl(0 70% 40%)\">Appears in 19 problems<\u002Fspan>\n            <\u002Fdiv>\n            <h2 style=\"margin:0 0 8px;font-size:24px;font-weight:700;letter-spacing:-.01em\">Caching<\u002Fh2>\n            <p style=\"margin:0 0 16px;font-size:14.5px;line-height:1.65;color:hsl(220 15% 28%);max-width:70ch;text-wrap:pretty\">Your weakest high-frequency concept. It shows up in 19 of the 30 problems you're preparing, and it's the reason three of your last five mocks lost points in deep dives. Fixing this one moves more of your score than any single problem will.<\u002Fp>\n            <div style=\"display:flex;flex-direction:column;gap:8px;margin-bottom:16px\">\n              <sc-for list=\"{{ conceptSubs }}\" as=\"s\" hint-placeholder-count=\"5\">\n                <div style=\"display:flex;align-items:center;gap:10px;border:1px solid hsl(220 15% 90%);border-radius:8px;padding:9px 11px\">\n                  <span style=\"font-size:13.5px;font-weight:500;flex:1\">{{ s.label }}<\u002Fspan>\n                  <div style=\"width:90px;height:5px;border-radius:9999px;background:hsl(220 15% 96%);overflow:hidden\"><div style=\"height:100%;border-radius:9999px;background:{{ s.color }};width:{{ s.w }}\"><\u002Fdiv><\u002Fdiv>\n                  <span style=\"font-size:12px;font-weight:700;color:{{ s.color }};width:26px;text-align:right\">{{ s.score }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:8px\">\n              <button sc-camel-on-click=\"{{ goRead }}\" style=\"border:0;cursor:pointer;background:#2563EB;color:#fff;border-radius:12px;padding:9px 15px;font-size:13px;font-weight:600\">Read the concept<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ goDrills }}\" style=\"cursor:pointer;background:#fff;border:1px solid hsl(220 15% 88%);border-radius:12px;padding:9px 15px;font-size:13px;font-weight:600;color:hsl(220 15% 20%)\">Drill 9 cards<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"background:#fff;border:1px solid hsl(220 15% 88%);border-radius:12px;box-shadow:0 1px 2px 0 rgb(0 0 0/.05);padding:16px\">\n            <div style=\"font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:hsl(220 10% 50%);margin-bottom:3px\">Practise it in context<\u002Fdiv>\n            <div style=\"font-size:12.5px;color:hsl(220 10% 50%);line-height:1.45;margin-bottom:11px\">Problems where caching is the deciding tradeoff, not a footnote.<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:8px\">\n              <sc-for list=\"{{ conceptProblems }}\" as=\"p\" hint-placeholder-count=\"4\">\n                <button sc-camel-on-click=\"{{ p.onOpen }}\" style=\"cursor:pointer;text-align:left;border:1px solid hsl(220 15% 90%);border-radius:8px;padding:9px 11px;background:#fff;display:flex;align-items:center;gap:8px\">\n                  <span style=\"font-size:13px;font-weight:500;flex:1;color:hsl(220 15% 20%)\">{{ p.name }}<\u002Fspan>\n                  <span style=\"border-radius:9999px;padding:1px 8px;font-size:11px;font-weight:700;background:{{ p.bg }};color:{{ p.fg }}\">{{ p.score }}<\u002Fspan>\n                <\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ================= MOBILE ================= -->\n      <sc-if value=\"{{ isMobile }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;gap:36px;align-items:flex-start;flex-wrap:wrap\">\n        <div style=\"flex:0 0 auto\">\n          <div style=\"width:393px;background:#0D1117;border-radius:54px;padding:11px;box-shadow:0 20px 25px -5px rgb(0 0 0/.1)\">\n            <div style=\"background:hsl(220 100% 97%);border-radius:44px;overflow:hidden\">\n            <div style=\"position:relative;height:52px;padding:0 28px 8px;display:flex;align-items:flex-end;justify-content:space-between\">\n              <span style=\"font-size:14px;font-weight:600;color:hsl(220 15% 20%)\">9:41<\u002Fspan>\n              <div style=\"position:absolute;left:50%;top:9px;transform:translateX(-50%);width:104px;height:28px;border-radius:9999px;background:#0D1117\"><\u002Fdiv>\n              <div style=\"display:flex;gap:5px;align-items:center;color:hsl(220 15% 20%)\"><i data-lucide=\"signal\"><\u002Fi><i data-lucide=\"wifi\"><\u002Fi><i data-lucide=\"battery-full\"><\u002Fi><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"padding:8px 16px 20px;display:flex;flex-direction:column;gap:14px;background:hsl(220 100% 97%);min-height:660px\">\n              <div style=\"display:flex;align-items:center;gap:10px\">\n                <div style=\"flex:1\">\n                  <div style=\"font-size:13px;color:hsl(220 10% 50%)\">14 cards · about 6 minutes<\u002Fdiv>\n                  <div style=\"font-size:22px;font-weight:700;letter-spacing:-.01em\">Card 3 of 14<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"width:38px;height:38px;border-radius:9999px;border:3px solid hsl(38 90% 62%);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:hsl(38 70% 34%)\">21%<\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"background:#fff;border:1px solid hsl(220 15% 88%);border-radius:12px;box-shadow:0 4px 6px -1px rgb(0 0 0/.1);padding:18px\">\n                <div style=\"display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap\">\n                  <span style=\"border-radius:9999px;padding:2px 9px;font-size:11px;font-weight:600;background:hsl(220 100% 97%);color:#1D4ED8\">Cloze<\u002Fspan>\n                  <span style=\"border-radius:9999px;padding:2px 9px;font-size:11px;font-weight:600;background:hsl(0 84% 60% / .13);color:hsl(0 70% 40%)\">Missed last time<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"font-size:18px;font-weight:500;line-height:1.55\">The correct pattern for expiring URLs is <span style=\"display:inline-block;min-width:96px;border-bottom:2px solid #2563EB;background:hsl(220 100% 97%);border-radius:4px;padding:0 6px;color:#1D4ED8;font-weight:600\">?<\u002Fspan> — check <code style=\"font-family:ui-monospace,Menlo,monospace;font-size:16px;background:hsl(220 15% 96%);padding:1px 5px;border-radius:4px\">expires_at<\u002Fcode> at read time and return <span style=\"display:inline-block;min-width:70px;border-bottom:2px solid #2563EB;background:hsl(220 100% 97%);border-radius:4px;padding:0 6px;color:#1D4ED8;font-weight:600\">?<\u002Fspan>.<\u002Fdiv>\n                <div style=\"margin-top:16px;font-size:13px;color:hsl(220 10% 50%);display:flex;align-items:center;gap:7px\"><i data-lucide=\"hand\" style=\"flex:0 0 16px\"><\u002Fi> Tap to reveal · swipe to grade<\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"display:flex;gap:8px\">\n                <button style=\"flex:1;cursor:pointer;border:1px solid hsl(0 84% 78%);background:hsl(0 84% 60% / .1);color:hsl(0 70% 40%);border-radius:12px;padding:13px 0;font-size:14px;font-weight:600\">Again<\u002Fbutton>\n                <button style=\"flex:1;cursor:pointer;border:1px solid hsl(38 90% 60%);background:hsl(38 90% 62% / .14);color:hsl(38 70% 30%);border-radius:12px;padding:13px 0;font-size:14px;font-weight:600\">Hard<\u002Fbutton>\n                <button style=\"flex:1;cursor:pointer;border:1px solid hsl(158 64% 60%);background:hsl(158 64% 52% / .12);color:hsl(158 64% 26%);border-radius:12px;padding:13px 0;font-size:14px;font-weight:600\">Good<\u002Fbutton>\n              <\u002Fdiv>\n\n              <div>\n                <div style=\"font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:hsl(220 10% 50%);margin-bottom:8px\">Up next<\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:8px\">\n                  <sc-for list=\"{{ mobileQueue }}\" as=\"m\" hint-placeholder-count=\"3\">\n                    <div style=\"background:#fff;border:1px solid hsl(220 15% 88%);border-left:2px solid {{ m.color }};border-radius:12px;padding:11px 13px\">\n                      <div style=\"font-size:14px;font-weight:500;line-height:1.4\">{{ m.label }}<\u002Fdiv>\n                      <div style=\"font-size:12px;color:hsl(220 10% 50%);margin-top:2px\">{{ m.meta }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"padding:6px 0 11px;display:flex;justify-content:center;background:hsl(220 100% 97%)\"><div style=\"width:134px;height:5px;border-radius:9999px;background:hsl(220 15% 20% / .28)\"><\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"flex:1 1 340px;min-width:300px;display:flex;flex-direction:column;gap:14px;max-width:520px\">\n          <div style=\"background:#fff;border:1px solid hsl(220 15% 88%);border-radius:12px;box-shadow:0 1px 2px 0 rgb(0 0 0/.05);padding:18px 20px\">\n            <div style=\"font-size:18px;font-weight:700;margin-bottom:6px\">The phone is deliberately not the whole product<\u002Fdiv>\n            <div style=\"font-size:14px;line-height:1.65;color:hsl(220 15% 30%);text-wrap:pretty\">Mobile carries the one activity that survives a 4-minute queue: graded recall. Reading a 500-line breakdown, drawing an architecture, and defending it under a timer all need a desk — putting them on a phone would produce the illusion of studying.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#fff;border:1px solid hsl(220 15% 88%);border-radius:12px;box-shadow:0 1px 2px 0 rgb(0 0 0/.05);padding:18px 20px\">\n            <div style=\"font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:hsl(220 10% 50%);margin-bottom:11px\">On mobile<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:11px\">\n              <sc-for list=\"{{ mobileScope }}\" as=\"m\" hint-placeholder-count=\"5\">\n                <div style=\"display:flex;gap:9px;align-items:flex-start\">\n                  <i data-lucide=\"{{ m.icon }}\" style=\"flex:0 0 16px;margin-top:2px;color:{{ m.iconFg }}\"><\u002Fi>\n                  <div>\n                    <div style=\"font-size:13.5px;font-weight:500;color:{{ m.fg }}\">{{ m.label }}<\u002Fdiv>\n                    <div style=\"font-size:12.5px;color:hsl(220 10% 50%);line-height:1.45\">{{ m.note }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n    <\u002Fdiv>\n  <\u002Fmain>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:1024},&quot;tone&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Coach&quot;,&quot;Neutral&quot;,&quot;Blunt&quot;],&quot;default&quot;:&quot;Coach&quot;,&quot;tsType&quot;:&quot;'Coach'|'Neutral'|'Blunt'&quot;,&quot;section&quot;:&quot;Coaching&quot;},&quot;level&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Mid&quot;,&quot;Senior&quot;,&quot;Staff+&quot;],&quot;default&quot;:&quot;Staff+&quot;,&quot;tsType&quot;:&quot;'Mid'|'Senior'|'Staff+'&quot;,&quot;section&quot;:&quot;Coaching&quot;},&quot;showTimers&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Coaching&quot;}}\">\nconst C = {\n  fg: 'hsl(220 15% 20%)', mut: 'hsl(220 10% 50%)', bd: 'hsl(220 15% 88%)',\n  soft: 'hsl(220 15% 96%)', blue: '#2563EB', blueDk: '#1D4ED8', blueBg: 'hsl(220 100% 97%)',\n  good: 'hsl(158 64% 52%)', goodDk: 'hsl(158 64% 32%)',\n  mid: 'hsl(38 90% 62%)', midDk: 'hsl(38 70% 32%)',\n  poor: 'hsl(0 70% 50%)', poorDk: 'hsl(0 70% 40%)',\n  amber: '#F59E0B', violet: '#8B5CF6', emerald: '#10B981', red: '#EF4444'\n};\n\nconst band = (n) => n >= 66 ? C.good : n >= 36 ? C.mid : C.poor;\nconst bandDk = (n) => n >= 66 ? C.goodDk : n >= 36 ? C.midDk : C.poorDk;\nconst bandBg = (n) => n >= 66 ? 'hsl(158 64% 52% / .15)' : n >= 36 ? 'hsl(38 90% 62% / .2)' : 'hsl(0 70% 50% / .12)';\n\nconst SECTIONS = ['Requirements', 'Core entities', 'API design', 'High-level design', 'Deep dives', 'Numbers'];\n\nconst PROBLEMS = [\n  ['Design Bitly', 'Read-Heavy / Hash-based Lookup', 'Easy', 62, '2 days ago', [82, 74, 70, 61, 44, 38]],\n  ['Design Distributed Rate Limiter', 'Coordination / Counting', 'Medium', 91, '5 days ago', [96, 92, 90, 88, 92, 86]],\n  ['Design Ad Click Aggregator', 'Stream Aggregation / Exactly-Once', 'Hard', 78, 'Last week', [88, 80, 74, 79, 72, 70]],\n  ['Design WhatsApp', 'Real-time Updates', 'Medium', 74, 'Last week', [84, 78, 72, 76, 66, 60]],\n  ['Design Facebook News Feed', 'Fan-out / Feed Aggregation', 'Medium–Hard', 55, '2 weeks ago', [70, 60, 54, 58, 44, 40]],\n  ['Design Yelp', 'Geospatial Search / Reviews', 'Medium', 48, '3 weeks ago', [62, 52, 50, 46, 38, 34]],\n  ['Design Uber', 'Geospatial Matching / Real-time', 'Hard', 41, '3 weeks ago', [58, 46, 42, 40, 30, 26]],\n  ['Design Dropbox', 'File Storage / Sync', 'Medium', 33, 'A month ago', [48, 36, 34, 30, 22, 20]],\n  ['Design YouTube Top K', 'Streaming Aggregation / Heavy Hitters', 'Hard', 24, 'A month ago', [40, 26, 24, 22, 14, 12]],\n  ['Design Google Docs', 'Real-time Collaboration / OT/CRDT', 'Hard', 12, 'Never', [20, 14, 10, 10, 6, 6]],\n  ['Design Ticketmaster', 'Booking / Concurrency Control', 'Medium', 0, 'Never', [0, 0, 0, 0, 0, 0]],\n  ['Design Robinhood', 'Trading / Real-time Prices', 'Hard', 0, 'Never', [0, 0, 0, 0, 0, 0]]\n];\n\nconst NFRS = [\n  { label: '1000:1 read:write ratio', causes: ['CDN edge', 'Redis L1 cache', 'Read service', 'Read replicas'],\n    because: 'Every read-path component exists because of this one number. Say it in the first two minutes and the rest of your design justifies itself.' },\n  { label: 'Redirects under 100ms globally', causes: ['CDN edge', 'Multi-region origin', 'Redis L1 cache'],\n    because: 'A single US-east cache means EU and APAC clicks pay 200–400ms of RTT. Latency, not throughput, is what forces edge and multi-region.' },\n  { label: 'Every short code maps to exactly one URL', causes: ['Redis counter', 'Postgres UNIQUE'],\n    because: 'Uniqueness is enforced by the database index, not by a read-before-write check. The counter avoids collisions by construction; UNIQUE is the final net.' },\n  { label: '99.99% availability, reads over writes', causes: ['Read replicas', 'Redis L1 cache', 'Read service'],\n    because: 'A broken redirect hurts more than a delayed create — so reads get replicas and caches, writes get just enough HA to stay correct.' }\n];\nconst COMPONENTS = ['CDN edge', 'Read service', 'Write service', 'Redis L1 cache', 'Redis counter', 'Postgres UNIQUE', 'Read replicas', 'Multi-region origin', 'Expiry worker'];\n\nconst STAGES = [\n  { n: 1, t: 'MVP', u: '0–100 users',\n    a: 'Single server plus Postgres on the same box. Short codes from a Postgres BIGSERIAL column, Base62-encoded in the app. One table: urls(short_code PK, long_url, created_at).',\n    s: 'Redis, custom aliases, expirations, auth, analytics, multi-region — none justify their operational cost yet.',\n    f: 'Your first viral link hits 500 RPS and the OS page cache is not enough. The connection pool saturates, p99 blows past 100ms, some redirects fail.' },\n  { n: 2, t: 'Early growth', u: '100–1,000 users',\n    a: 'A single Redis instance in front of the DB: read Redis, fall back to Postgres, populate on miss. Add a read replica so admin queries stop fighting the hot path. Static assets to a CDN.',\n    s: 'Sharding, multi-region, edge compute, counter-based IDs. BIGSERIAL is fine at single-digit write QPS.',\n    f: 'The app server itself becomes the bottleneck — one process cannot push 10k+ RPS through Redis, and a deploy drops all traffic.' },\n  { n: 3, t: 'Product-market fit', u: '1K–100K users',\n    a: 'Split Read Service and Write Service behind a load balancer. Replace BIGSERIAL with a Redis counter plus batched INCRBY so any write pod mints IDs without DB coordination. Primary plus two read replicas. Redis via Sentinel for HA. Custom aliases and expirations ship.',\n    s: 'Edge compute, geo-distribution, DB sharding. Storage is still under 100GB.',\n    f: 'Traffic goes global. EU and APAC see 200–400ms redirects because every click crosses the Atlantic. Peak RPS starts brushing a single Redis node.' },\n  { n: 4, t: 'Scale-out', u: '100K–10M users',\n    a: 'CDN edge Workers serve the 302 straight from edge cache for the hot set; origin sees only misses. Active-active regions, each with its own Redis and DB replica. Disjoint per-region counter ranges. Async cross-region replication. A dedicated TTL worker evicts.',\n    s: 'Sharding by short_code is tempting but still unnecessary — 500GB fits on one node.',\n    f: 'The corpus crosses 10B URLs. The B-tree index no longer fits in memory on any replica, and cache-miss p99 degrades.' },\n  { n: 5, t: 'Hyperscale', u: '10M+ users',\n    a: 'Shard the URL table by hash(short_code), N shards per region. Redis Cluster sharded on the same key so cache and DB shards line up — no hot keys from skewed routing. Tiered cache: edge → regional Redis → per-shard in-memory. Bot defence at the edge. Cold storage tier in S3 for links with no clicks in N months.',\n    s: 'Nothing architectural. Beyond here it is cost engineering: CDN contracts, Base62 tuning, bytes per row.',\n    f: 'No next stage. Scaling becomes operational — chaos drills on regional failover, counter-range exhaustion runbooks, cross-region consistency dashboards.' }\n];\n\nconst MATRIX_HEAD = ['Dimension', 'Fan-out on Read', 'Fan-out on Write', 'Hybrid (production)'];\nconst MATRIX_ROWS = [\n  ['Write latency', 'O(1)', 'O(followers) async', 'O(1) — always'],\n  ['Read latency', 'O(followees) scatter-gather', 'O(1) cache lookup', 'O(1) + small live merge'],\n  ['Write amplification', 'None', '100M writes per celebrity post', 'Bounded by follower threshold'],\n  ['Freshness', 'Always fresh', 'Eventual (fanout queue delay)', 'Eventual; instant for celebrities'],\n  ['Celebrity handling', 'Natural', 'Impossible at scale', 'Explicit routing flag per account'],\n  ['Cold rebuild cost', 'Per read (expensive)', 'Once at post creation', 'Once, plus celebrity slice']\n];\n\nconst NAV = [\n  ['today', 'Today', 'layout-dashboard', '4'],\n  ['library', 'Library', 'library', ''],\n  ['read', 'Read', 'book-open', ''],\n  ['practice', 'Practice', 'timer', ''],\n  ['review', 'Review', 'git-compare-arrows', '1'],\n  ['drills', 'Drills', 'layers', '14'],\n  ['concepts', 'Concepts', 'share-2', ''],\n  ['mobile', 'Mobile', 'smartphone', '']\n];\n\nconst TITLES = {\n  today: ['Home', \"Today's session\"],\n  library: ['Library', 'All problems'],\n  read: ['Library · Design Bitly', 'Read with comprehension checks'],\n  practice: ['Practice · Design Bitly', 'Mock session'],\n  review: ['Practice · Design Bitly', 'Session review'],\n  drills: ['Drills', 'Spaced repetition queue'],\n  concepts: ['Concepts', 'Concept map'],\n  mobile: ['Mobile', 'Flashcard companion']\n};\n\nclass Component extends DCLogic {\n  state = {\n    screen: 'today', track: 'HLD', depth: 0, stage: 2, nfr: 0,\n    revealed302: false, variant: 'A', matrix: {}, filter: 'All'\n  };\n\n  componentDidMount() { this.icons(); }\n  componentDidUpdate() { this.icons(); }\n  icons() {\n    const l = window.lucide;\n    if (!l || !l.createIcons) { if (!this._t) this._t = setTimeout(() => { this._t = null; this.icons(); }, 250); return; }\n    try {\n      l.createIcons({ attrs: { width: 16, height: 16, 'stroke-width': 2 } });\n      l.createIcons({ nameAttr: 'data-lucide-lg', attrs: { width: 20, height: 20, 'stroke-width': 2 } });\n    } catch (e) {}\n  }\n\n  go = (s) => () => this.setState({ screen: s });\n\n  renderVals() {\n    const st = this.state;\n    const level = this.props.level ?? 'Senior';\n    const tone = this.props.tone ?? 'Coach';\n    const timers = this.props.showTimers ?? true;\n\n    const nav = NAV.map(([id, label, icon, badge]) => ({\n      label, icon, badge,\n      fw: st.screen === id ? 600 : 400,\n      bg: st.screen === id ? C.blueBg : 'transparent',\n      fg: st.screen === id ? C.blueDk : C.fg,\n      badgeFg: st.screen === id ? C.blueDk : C.mut,\n      onSelect: this.go(id)\n    }));\n\n    const tracks = ['HLD', 'LLD'].map(t => ({\n      label: t === 'HLD' ? 'HLD · 30' : 'LLD · 0',\n      onSelect: () => this.setState({ track: t, screen: 'library' }),\n      bg: st.track === t ? C.blue : '#fff',\n      fg: st.track === t ? '#fff' : C.mut,\n      bc: st.track === t ? C.blue : C.bd\n    }));\n\n    const levels = ['Mid', 'Senior', 'Staff+'].map(l => ({\n      label: l,\n      onSelect: () => this.setState({}),\n      bg: level === l ? '#fff' : 'transparent',\n      fg: level === l ? C.fg : C.mut,\n      sh: level === l ? '0 1px 2px 0 rgb(0 0 0/.05)' : 'none'\n    }));\n\n    const coachLines = {\n      Coach: \"You closed the read path last session and left the write path untouched — that's normal, it's the harder half. Two deep dives left: counter coordination and multi-region. About 20 minutes.\",\n      Neutral: 'Two of seven deep dives remain: counter coordination and multi-region deployment. Estimated 20 minutes.',\n      Blunt: \"You've read the easy half. Counter coordination and multi-region are where this problem actually gets asked — and where you stopped last time.\"\n    };\n\n    const drillCoach = {\n      Coach: \"Recall first, while it's cheap. These 14 cards came from answers you half-knew — not from a generic deck.\",\n      Neutral: '14 cards due. Generated from gaps recorded in previous sessions.',\n      Blunt: \"14 cards you've already got wrong at least once. Start here, not with a new problem.\"\n    };\n\n    const reviewCopy = {\n      Coach: ['Strong read path. The write path is where the points went.', \"You led with the 1000:1 ratio unprompted — that's a Senior-level opening and it carried the whole first half. Where you lost ground: you described the miss window precisely and then didn't name the mechanism that fixes it. That's a vocabulary gap, not a reasoning gap, which is the good kind — one drill and it's yours.\"],\n      Neutral: ['71/100 · manageable band', 'Read path fully covered. Cache stampede mitigation and shard-key alignment were not named. Two rubric points unaddressed in the write path.'],\n      Blunt: ['You described a cache stampede without naming it.', 'You got to the exact right observation — N concurrent misses on one key — and then stopped. An interviewer hears that as \"recognises the symptom, does not know the fix.\" Single-flight. Say the word next time.']\n    };\n\n    const nfr = NFRS[st.nfr];\n    const cells = [];\n    MATRIX_HEAD.forEach(h => cells.push({ text: h, isHead: true }));\n    MATRIX_ROWS.forEach((row, ri) => row.forEach((txt, ci) => {\n      const key = ri + ':' + ci;\n      const shown = ci === 0 || !!st.matrix[key];\n      cells.push({ text: shown ? txt : 'tap to check', isHead: false, key, ci, shown, ri });\n    }));\n    const matrixCells = cells.map(c => {\n      if (c.isHead) return { text: c.text, bg: C.soft, bc: C.soft, fg: C.mut, fw: 600, cursor: 'default', onSelect: () => {} };\n      if (c.ci === 0) return { text: c.text, bg: '#fff', bc: C.bd, fg: C.fg, fw: 600, cursor: 'default', onSelect: () => {} };\n      if (c.shown) return { text: c.text, bg: 'hsl(158 64% 52% / .1)', bc: 'hsl(158 64% 70%)', fg: C.goodDk, fw: 400, cursor: 'default', onSelect: () => {} };\n      return {\n        text: 'tap to check', bg: 'hsl(220 15% 96%)', bc: C.bd, fg: 'hsl(220 10% 62%)', fw: 400, cursor: 'pointer',\n        onSelect: () => this.setState(s => ({ matrix: Object.assign({}, s.matrix, { [c.key]: true }) }))\n      };\n    });\n    const revealedCount = Object.keys(st.matrix).length;\n\n    const stage = STAGES[st.stage];\n\n    const rubricByLevel = {\n      Mid: [['Names a cache on the read path', 'check'], ['Knows reads outnumber writes', 'check'], ['Mentions the DB could fall over', 'circle'], ['Not expected: stampede mechanics', 'minus']],\n      Senior: [['Distinguishes cache TTL from URL expiration', 'check'], ['Designs cache + replicas + eviction', 'check'], ['Names request coalescing / single-flight', 'circle'], ['Walks through Redis failover behaviour', 'circle']],\n      'Staff+': [['Leads with tiered cache and Zipfian hit-rate reasoning', 'check'], ['Addresses cache stampede explicitly', 'circle'], ['Aligns cache and DB shard keys on one key', 'circle'], ['Chaos-tests: region loss, counter-range exhaustion', 'circle']]\n    };\n    const rubric = rubricByLevel[level].map(([label, icon]) => ({\n      label, icon,\n      iconFg: icon === 'check' ? C.good : icon === 'minus' ? C.mut : C.mid,\n      fg: icon === 'check' ? C.fg : icon === 'minus' ? C.mut : C.fg\n    }));\n\n    const phaseData = [\n      ['Requirements', 'list-checks', '5:00 / 5', 100, 'done'],\n      ['Core entities', 'boxes', '2:40 / 3', 89, 'done'],\n      ['API design', 'plug', '3:10 / 4', 78, 'done'],\n      ['High-level design', 'workflow', '19:00 / 15', 100, 'over'],\n      ['Deep dives', 'microscope', '6:20 / 20', 32, 'now']\n    ];\n\n    return {\n      // shell\n      nav, tracks, levels, level,\n      crumb: TITLES[st.screen][0], screenTitle: TITLES[st.screen][1],\n      streak: ['M', 'T', 'W', 'T', 'F', 'S', 'S'].map((label, i) => ({\n        label, h: [14, 22, 10, 26, 18, 30, 8][i] + 'px',\n        bg: i === 5 ? C.blue : i === 6 ? C.soft : 'hsl(220 70% 50% / .35)'\n      })),\n      goPractice: this.go('practice'), goRead: this.go('read'), goReview: this.go('review'),\n      goDrills: this.go('drills'), goConcepts: this.go('concepts'),\n\n      isToday: st.screen === 'today', isLibrary: st.screen === 'library', isRead: st.screen === 'read',\n      isPractice: st.screen === 'practice', isReview: st.screen === 'review', isDrills: st.screen === 'drills',\n      isConcepts: st.screen === 'concepts', isMobile: st.screen === 'mobile',\n\n      // today\n      coachLine: coachLines[tone],\n      plan: [\n        ['Warm-up recall', 'Drills', '6 min', 'Recall is cheapest when nothing else is loaded. 14 cards you have already missed once.'],\n        ['Read: Scaling Writes', 'Read', '12 min', 'The pattern behind three problems in your weak list. Layman depth is already checked off.'],\n        ['Mock: Ticketmaster', 'Practice', timers ? '45 min · timed' : '45 min', 'Never attempted. Contention is your lowest concept — this problem is entirely contention.'],\n        ['Review the diff', 'Review', '8 min', 'The block everyone skips. It is the only one that turns a mock into a score change.']\n      ].map(([title, kind, mins, why], i) => ({\n        title, kind, mins, why,\n        dot: i === 0 ? C.blue : C.bd, dotFill: i === 0 ? C.blue : '#fff',\n        fg: C.fg,\n        tagBg: i === 0 ? C.blueBg : C.soft, tagFg: i === 0 ? C.blueDk : C.mut\n      })),\n      mastery: [78, 71, 66, 58, 41, 34].map((score, i) => ({\n        label: SECTIONS[i], score, color: band(score), w: score + '%'\n      })),\n      goodSignals: [\n        'You state the read:write ratio before touching the design in 4 of your last 5 mocks.',\n        'Requirements phase is consistently inside 5 minutes.',\n        'Rate Limiter is at 91 — Redis coordination is genuinely yours now.'\n      ],\n      poorSignals: [\n        'Deep dives run out of clock: 6 min used of the 20 you allotted, three sessions running.',\n        'Back-of-envelope numbers are your lowest section at 34. You reach for a calculator.',\n        'Caching appears in 19 problems and sits at 44. It is the highest-leverage fix on this page.'\n      ],\n\n      // library\n      trackIsHLD: st.track === 'HLD', trackIsLLD: st.track === 'LLD',\n      libCount: PROBLEMS.length + ' of 30 shown',\n      filters: ['All', 'Never attempted', 'Weak (<50)', 'Due for review', 'Hard', 'Real-time', 'Geospatial'].map(f => ({\n        label: f, onSelect: () => this.setState({ filter: f }),\n        bg: st.filter === f ? C.blue : '#fff',\n        fg: st.filter === f ? '#fff' : C.fg,\n        bc: st.filter === f ? C.blue : C.bd\n      })),\n      problems: PROBLEMS.map(([name, pattern, difficulty, score, last, bars]) => ({\n        name, pattern, difficulty, meta: last === 'Never' ? 'Not attempted' : 'Practised ' + last,\n        diffBg: difficulty === 'Easy' ? 'hsl(158 64% 52% / .15)' : difficulty === 'Medium' ? 'hsl(38 90% 62% / .2)' : 'hsl(0 70% 50% / .12)',\n        diffFg: difficulty === 'Easy' ? C.goodDk : difficulty === 'Medium' ? C.midDk : C.poorDk,\n        scoreLabel: score === 0 ? '—' : String(score),\n        scoreBg: score === 0 ? C.soft : bandBg(score),\n        scoreFg: score === 0 ? C.mut : bandDk(score),\n        cta: score === 0 ? 'Start' : 'Resume',\n        bars: bars.map((v, i) => ({ label: SECTIONS[i], color: v === 0 ? 'hsl(220 15% 90%)' : band(v), h: Math.max(4, Math.round(v * 0.22)) + 'px' })),\n        onOpen: this.go('read')\n      })),\n      lldPlan: [\n        { title: 'UML canvas', body: 'Class boxes, relationships, and a diff against a reference model — the LLD equivalent of the whiteboard.' },\n        { title: 'Signature recall', body: 'Cloze cards on method signatures, responsibilities, and which SOLID principle a smell violates.' },\n        { title: 'Code, not boxes', body: 'An editor instead of a canvas. LLD answers compile; HLD answers do not.' }\n      ],\n\n      // read\n      depths: ['Layman', 'Core', 'Deep dive'].map((label, i) => ({\n        label, onSelect: () => this.setState({ depth: i }),\n        bg: st.depth === i ? '#fff' : 'transparent',\n        fg: st.depth === i ? C.fg : C.mut,\n        sh: st.depth === i ? '0 1px 2px 0 rgb(0 0 0/.05)' : 'none'\n      })),\n      depthLayman: st.depth === 0, depthCore: st.depth === 1, depthDeep: st.depth === 2,\n      nextDepth: () => this.setState(s => ({ depth: Math.min(2, s.depth + 1) })),\n      nfrs: NFRS.map((n, i) => ({\n        label: n.label, onSelect: () => this.setState({ nfr: i }),\n        bg: st.nfr === i ? C.blueBg : '#fff',\n        bc: st.nfr === i ? C.blue : C.bd,\n        fg: st.nfr === i ? C.blueDk : C.fg,\n        fw: st.nfr === i ? 600 : 400\n      })),\n      components: COMPONENTS.map(label => {\n        const on = nfr.causes.indexOf(label) > -1;\n        return { label, bg: on ? C.blueBg : l', blurb: 'One adaptive question at a time, no clock.' }\n      ].map(v => ({\n        ...v, onSelect: () => this.setState({ variant: v.key }),\n        bg: st.variant === v.key ? '#fff' : 'hsl(220 15% 96% / .7)',\n        bc: st.variant === v.key ? C.blue : C.bd,\n        sh: st.variant === v.key ? '0 4px 6px -1px rgb(0 0 0/.1)' : 'none',\n        tag: st.variant === v.key ? C.blueDk : C.mut\n      })),\n      variantA: st.variant === 'A', variantB: st.variant === 'B', variantC: st.variant === 'C',\n      phases: phaseData.map(([label, icon, time, w, state]) => ({\n        label, icon, time, w: w + '%',\n        bg: state === 'now' ? C.blueBg : '#fff',\n        bc: state === 'now' ? C.blue : C.bd,\n        fg: state === 'now' ? C.blueDk : state === 'done' ? C.fg : C.fg,\n        fw: state === 'now' ? 600 : 400,\n        iconFg: state === 'over' ? C.poor : state === 'now' ? C.blue : C.good,\n        timeFg: state === 'over' ? C.poorDk : C.mut,\n        barFg: state === 'over' ? C.poor : state === 'now' ? C.blue : C.good\n      })),\n      followups: [\n        { tag: 'Interviewer:', text: 'Your edge cache absorbs the viral link. What happens the moment that entry expires?', bg: C.blueBg, bc: 'hsl(220 33% 88%)', fg: C.fg },\n        { tag: 'Interviewer:', text: 'You said \"read replica\" — is the replica actually in the path of a cache miss, or behind another layer?', bg: C.blueBg, bc: 'hsl(220 33% 88%)', fg: C.fg },\n        { tag: 'Queued:', text: 'Where does the Redis counter live in this picture, and what happens if that node dies mid-write?', bg: C.soft, bc: C.bd, fg: C.mut }\n      ],\n      rubric,\n      rubricNote: level === 'Mid' ? 'Mid: name the cache, know reads dominate. Stampede mechanics are not expected.'\n        : level === 'Senior' ? 'Senior: design the cache layer and distinguish TTL from URL expiration.'\n        : 'Staff+: lead with tiered cache and Zipfian reasoning, then chaos-test your own plan.',\n      palette: [\n        ['Client', C.mut, '1'], ['CDN / Edge', C.blue, '1'], ['Load balancer', C.mut, '1'],\n        ['Read service', C.blue, '1'], ['Write service', C.blue, ''], ['Redis cache', C.red, '1'],\n        ['Redis counter', C.red, ''], ['Postgres', C.emerald, '1'], ['Read replica', C.emerald, ''],\n        ['Kafka', C.violet, ''], ['S3 cold tier', C.amber, '']\n      ].map(([label, color, used]) => ({ label, color, used })),\n      canvasNodes: [\n        { label: 'Client', sub: 'browser click', x: '13%', y: '18%', bc: C.bd },\n        { label: 'CDN Edge', sub: '302 from edge cache', x: '41%', y: '18%', bc: C.blue },\n        { label: 'Read Service', sub: 'N replicas', x: '75%', y: '18%', bc: C.blue },\n        { label: 'Redis L1', sub: 'short_code → long_url', x: '75%', y: '52%', bc: C.red },\n        { label: 'Postgres', sub: 'urls(short_code PK)', x: '75%', y: '85%', bc: C.emerald }\n      ],\n      canvasEdges: [\n        { x1: '13%', y1: '18%', x2: '41%', y2: '18%', dash: '0' },\n        { x1: '41%', y1: '18%', x2: '75%', y2: '18%', dash: '0' },\n        { x1: '75%', y1: '18%', x2: '75%', y2: '52%', dash: '0' },\n        { x1: '75%', y1: '52%', x2: '75%', y2: '85%', dash: '4 4' }\n      ],\n      reqChecks: [\n        ['Redirect resolves in under 100ms', 'check', C.good],\n        ['1000:1 read ratio absorbed', 'check', C.good],\n        ['Short code uniqueness guaranteed', 'circle', C.mid],\n        ['Custom alias conflict returns 409', 'circle', C.mid],\n        ['Expiration enforced somewhere', 'x', C.poor]\n      ].map(([label, icon, iconFg]) => ({ label, icon, iconFg, fg: icon === 'check' ? C.fg : icon === 'x' ? C.poorDk : C.fg })),\n      socraticTrail: [1, 1, 1, 2, 1, 1, 0, 0, 0, 0, 0, 0].map(v => ({\n        bg: v === 1 ? C.good : v === 2 ? C.mid : 'hsl(220 15% 90%)'\n      })),\n      socraticStats: [\n        { label: 'Answered', value: '6', color: C.fg },\n        { label: 'Fully correct', value: '4', color: C.goodDk },\n        { label: 'Partial', value: '2', color: C.midDk },\n        { label: 'Bluffed', value: '0', color: C.goodDk }\n      ],\n      queuedCards: [\n        { label: 'Shard-key alignment: cache and DB on one key', color: C.poor },\n        { label: 'Counter-node SPOF and batched INCRBY', color: C.mid },\n        { label: 'Zipfian access → cache hit-rate reasoning', color: C.mid }\n      ],\n\n      // review\n      reviewHeadline: reviewCopy[tone][0], reviewBody: reviewCopy[tone][1],\n      reviewSections: [88, 79, 74, 76, 52, 58].map((score, i) => ({\n        label: SECTIONS[i], score, color: band(score), w: score + '%'\n      })),\n      gaps: [\n        { severity: 'Costly', title: 'You described a cache stampede but never named it', source: 'Deep dive 3',\n          body: 'You correctly identified thousands of concurrent misses on one key at TTL expiry, then moved on. The reference answer names request coalescing / single-flight. Interviewers score the mechanism, not the symptom.',\n          color: C.poor, tagBg: 'hsl(0 70% 50% / .12)', tagFg: C.poorDk },\n        { severity: 'Costly', title: 'Cache and DB shard keys were not aligned', source: 'Hyperscale stage',\n          body: 'You sharded the URL table by hash(short_code) and left Redis Cluster on its default hashing. Misaligned keys produce hot nodes under skewed routing. One sentence would have closed it.',\n          color: C.poor, tagBg: 'hsl(0 70% 50% / .12)', tagFg: C.poorDk },\n        { severity: 'Worth fixing', title: 'Expiration treated as a delete', source: 'Insider tips',\n          body: 'You proposed a cron job that hard-deletes expired rows. Your own notes say expiration is a read-time check: keep the row, compare expires_at, return 410 Gone, and GC off-peak.',\n          color: C.mid, tagBg: 'hsl(38 90% 62% / .2)', tagFg: C.midDk }\n      ],\n\n      // drills\n      drillCoach: drillCoach[tone],\n      queueCounts: [\n        { n: '14', label: 'Due now', color: C.blueDk },\n        { n: '6', label: 'Learning', color: C.midDk },\n        { n: '112'

a-flowchart-ANTI-0" data-look="classic" transform="translate(758, 33.5)"><rect class="basic label-container" style="" x="-123.4453125" y="-25.5" width="246.890625" height="51"></rect><g class="label" style="" transform="translate(-93.4453125, -10.5)"><rect></rect><foreignObject width="186.890625" height="21"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="nodeLabel "><p>Real Production Anti-Patterns</p></span></div></foreignObject></g></g><g class="node default  " id="m4061563effcdaf6a-flowchart-A1-2" data-look="classic" transform="translate(138, 176.5)"><rect class="basic label-container" style="fill:#FFB6C1 !important" x="-130" y="-67.5" width="260" height="135"></rect><g class="label" style="" transform="translate(-100, -52.5)"><rect></rect><foreignObject width="200" height="105"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel "><p>❌ Sharding by created_at<br/>All new writes → hotspot on latest shard<br/>Fix: Hash the timestamp or use compound key</p></span></div></foreignObject></g></g><g class="node default  " id="m4061563effcdaf6a-flowchart-A2-4" data-look="classic" transform="translate(448, 176.5)"><rect class="basic label-container" style="fill:#FFE4B5 !important" x="-130" y="-67.5" width="260" height="135"></rect><g class="label" style="" transform="translate(-100, -52.5)"><rect></rect><foreignObject width="200" height="105"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel "><p>❌ Sharding a small table<br/>10GB data doesn't need sharding<br/>Fix: Single DB + read replicas handles this</p></span></div></foreignObject></g></g><g class="node default  " id="m4061563effcdaf6a-flowchart-A3-6" data-look="classic" transform="translate(758, 176.5)"><rect class="basic label-container" style="fill:#FFB6C1 !important" x="-130" y="-67.5" width="260" height="135"></rect><g class="label" style="" transform="translate(-100, -52.5)"><rect></rect><foreignObject width="200" height="105"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel "><p>❌ Cross-shard foreign keys<br/>Referential integrity breaks across shards<br/>Fix: Enforce in application code or denormalize</p></span></div></foreignObject></g></g><g class="node default  " id="m4061563effcdaf6a-flowchart-A4-8" data-look="classic" transform="translate(1068, 176.5)"><rect class="basic label-container" style="fill:#FFB6C1 !important" x="-130" y="-67.5" width="260" height="135"></rect><g class="label" style="" transform="translate(-100, -52.5)"><rect></rect><foreignObject width="200" height="105"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel "><p>❌ Changing the shard key later<br/>All data must move → major incident<br/>Fix: Choose your shard key very carefully upfront</p></span></div></foreignObject></g></g><g class="node default  " id="m4061563effcdaf6a-flowchart-A5-10" data-look="classic" transform="translate(1378, 176.5)"><rect class="basic label-container" style="fill:#FFE4B5 !important" x="-130" y="-67.5" width="260" height="135"></rect><g class="label" style="" transform="translate(-100, -52.5)"><rect></rect><foreignObject width="200" height="105"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel "><p>❌ Too few shards<br/>'We'll start with 4 and add more'<br/>Fix: Start with 64+ for any serious system</p></span></div></foreignObject></g></g></g></g></g><defs><filter id="m4061563effcdaf6a-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"></feDropShadow></filter></defs><defs><filter id="m4061563effcdaf6a-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"></feDropShadow></filter></defs><linearGradient id="m4061563effcdaf6a-gradient" gradientUnits="objectBoundingBox" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#2563EB" stop-opacity="1"></stop><stop offset="100%" stop-color="hsl(224, 60%, 87.0588235294%)" stop-opacity="1"></stop></linearGradient></svg>
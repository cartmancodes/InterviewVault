name: Build and deploy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  # baked into sitemap.xml
  SITE_ORIGIN: https://cartmancodes.com

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tools/package-lock.json

      - name: Install build dependencies
        working-directory: tools
        run: npm ci

      # Puppeteer needs a browser. render-diagrams.mjs falls back to Puppeteer's
      # own Chrome when CHROME_PATH is unset, so just make sure one is installed.
      - name: Install Chrome for Puppeteer
        working-directory: tools
        run: npx puppeteer browsers install chrome

      # Diagrams are content-hashed, so an exact hit skips rendering entirely and
      # a partial hit re-renders only the diagrams that actually changed.
      # The on-disk cache key is sha1(mermaid source) ALONE — it does not see the
      # theme. So the workflow key must also cover everything else that decides
      # what an SVG looks like: the renderer (theme variables, themeCSS, the
      # post-render rewrites) and the pinned mermaid version. Without them a
      # re-theme would restore stale SVGs and silently undo itself.
      - name: Restore rendered diagrams
        uses: actions/cache@v4
        with:
          path: site/assets/diagrams
          key: diagrams-${{ hashFiles('tools/render-diagrams.mjs', 'tools/package-lock.json') }}-${{ hashFiles('LLD/**/*.md', 'DSA/**/*.md') }}
          restore-keys: |
            diagrams-${{ hashFiles('tools/render-diagrams.mjs', 'tools/package-lock.json') }}-

      - name: Check DSA chapters and C++ samples
        run: node tools/check-dsa.mjs

      - name: Check Python samples parse
        run: python3 tools/check-python.py

      # A source gate, so it runs before the build like the two above: the
      # landing page's motion pause button is a WCAG 2.2.2 mechanism, and an
      # animation that forgets to bind --amb makes it lie.
      - name: Check portfolio motion is pausable
        run: node tools/check-motion.mjs

      - name: Render diagrams
        working-directory: tools
        run: node render-diagrams.mjs

      - name: Build site
        working-directory: tools
        run: node build-site.mjs

      - name: Check links, assets and anchors
        run: node tools/check-site.mjs

      - name: Upload site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: site
          retention-days: 7

  deploy:
    # Pull requests build and validate, but only master publishes.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      # wrangler.toml lives in the repo and tells the Worker where its assets
      # are, so this job needs the checkout as well as the built site.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
